<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quán Trọ Nhà Mèo - Nơi Dừng Chân Thảnh Thơi</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes float-note { 0% { transform: translateY(0px) scale(0.8); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(-40px) translateX(15px) scale(1.2); opacity: 0; } }
    @keyframes falling-leaf { 0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; } 20% { opacity: 0.8; } 100% { transform: translate(100px, 100vh) rotate(360deg); opacity: 0; } }
    @keyframes firefly-glow { 0%, 100% { opacity: 0.2; transform: scale(0.8) translateY(0); } 50% { opacity: 0.9; transform: scale(1.3) translateY(-15px); } }
    .animate-spin-slow { animation: spin-slow 8s linear infinite; }
    .animate-float-1 { animation: float-note 2.5s ease-in-out infinite; }
    .animate-float-2 { animation: float-note 3s ease-in-out 1s infinite; }
    .leaf-particle { position: fixed; pointer-events: none; z-index: 1; animation: falling-leaf 12s linear infinite; }
    .firefly-particle { position: fixed; pointer-events: none; z-index: 1; border-radius: 50%; animation: firefly-glow 4s ease-in-out infinite; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 4px; }
    .drag-over { border-color: #10b981 !important; background-color: rgba(16, 185, 129, 0.1) !important; }
  </style>
</head>
<body class="transition-colors duration-500 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ==========================================
    // INITIAL MOCK DATABASE
    // ==========================================
    const INITIAL_DB = {
      users: [],
      rooms: [
        { id: 1, name: "Phòng Trà Mây Ngủ", image: "https://picsum.photos/seed/room1/600/400", tags: ["Thư giãn"], note: "Ban công ngắm suối", idea: "Gỗ mộc và rèm lụa", isCompleted: false, link: "", votes: 42, pinRank: 1, createdAt: Date.now() },
        { id: 2, name: "Gác Mái Đom Đóm", image: "https://picsum.photos/seed/room2/600/400", tags: ["Lãng mạn"], note: "Kính thiên văn", idea: "Trần nhà kính", isCompleted: false, link: "", votes: 35, pinRank: 2, createdAt: Date.now() - 1000 },
        { id: 3, name: "Căn Nhà Gỗ (Đã Mở)", image: "https://picsum.photos/seed/room5/600/400", tags: ["Hoàn thành"], note: "Đã hoạt động", idea: "Căn đầu tiên", isCompleted: true, link: "https://google.com", votes: 89, pinRank: 0, createdAt: Date.now() - 5000 }
      ],
      songs: [
        { id: 1, title: "Khúc Hát Ban Mai", artist: "Mèo Du Ca", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" }
      ],
      shopItems: [
        { id: "giuong_nem", name: "Giường Nệm Bông", category: "Nội thất", price: 40, icon: "🛏️", image: "" },
        { id: "cay_phong", name: "Cây Phong Đỏ", category: "Sân vườn", price: 30, icon: "🍁", image: "" },
        { id: "meo_cam", name: "Mèo Cam Béo", category: "Thú cưng", price: 80, icon: "🐈", image: "" }
      ],
      quizzes: [
        { id: 1, q: "Loài hoa nào thường nở rộ báo hiệu mùa xuân về bên hiên nhà gỗ?", options: ["Hoa Cúc", "Hoa Mai & Đào", "Hoa Hướng Dương", "Hoa Bồ Công Anh"], ansIdx: 1 },
        { id: 2, q: "Lộc (🍀) trong Quán Trọ không thể dùng để làm gì?", options: ["Mua nội thất", "Đổi tên biển nhà", "Mua lợi thế chơi game", "Mua thú cưng"], ansIdx: 2 }
      ],
      settings: { maxLostItems: 8 }
    };

    // Helper: Reset Daily Limits (00:00)
    const getFreshDailyLimits = () => ({
      date: new Date().toDateString(),
      water: 0, fish: 0, star: 0, diary: 0, story: 0, tea: 0, quiz: 0, checkIn: 0,
      lostItemsCaught: 0,
      lostItemsMaxForToday: Math.floor(Math.random() * 5) + 6 // 6 to 10 items
    });

    // Helper: Default User Schema
    const createNewUser = (email, password, name) => ({
      id: Date.now().toString(),
      email, password, name,
      avatar: `https://api.dicebear.com/7.x/bottts/svg?seed=${name}`,
      loc: 100,
      houseName: "Căn Nhà Nhỏ",
      hasCustomHouseName: false,
      checkInStreak: 0,
      inventory: [], // string IDs from shop
      placedItems: [], // { uid: string, shopId: string, x: number, y: number, area: 'house'|'garden' }
      fishCollection: [],
      teaRecipes: [],
      storyChapters: [],
      diaryEntries: [],
      dailyLimits: getFreshDailyLimits()
    });

    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem("theme") || "light");
      const [db, setDb] = useState(() => JSON.parse(localStorage.getItem("quan_tro_db")) || INITIAL_DB);
      const [currentUser, setCurrentUser] = useState(() => JSON.parse(localStorage.getItem("user_session")) || null);
      const [isAdmin, setIsAdmin] = useState(false);
      
      const [activeTab, setActiveTab] = useState("rooms");
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState("login"); // 'login' | 'register' | 'admin'
      const [notification, setNotification] = useState("");
      const [showMusicDrawer, setShowMusicDrawer] = useState(false);

      // Save states
      useEffect(() => { localStorage.setItem("quan_tro_db", JSON.stringify(db)); }, [db]);
      useEffect(() => { localStorage.setItem("theme", theme); }, [theme]);
      useEffect(() => {
        if (currentUser) {
          localStorage.setItem("user_session", JSON.stringify(currentUser));
          // Sync current user to DB users list
          setDb(prev => ({
            ...prev,
            users: prev.users.map(u => u.id === currentUser.id ? currentUser : u)
          }));
        } else {
          localStorage.removeItem("user_session");
        }
      }, [currentUser]);

      // Daily Reset Check
      useEffect(() => {
        if (currentUser) {
          const today = new Date().toDateString();
          if (currentUser.dailyLimits.date !== today) {
            updateUser({ dailyLimits: getFreshDailyLimits() });
          }
        }
      }, [currentUser]);

      const notify = (msg) => { setNotification(msg); setTimeout(() => setNotification(""), 3500); };

      const updateUser = (updates) => {
        setCurrentUser(prev => ({ ...prev, ...updates }));
      };

      const addLoc = (amount, reason) => {
        if (!currentUser) return;
        updateUser({ loc: currentUser.loc + amount });
        notify(`🍀 +${amount} Lộc (${reason})`);
      };

      const checkLimit = (gameKey) => {
        if (!currentUser) { notify("Vui lòng đăng nhập Khách để chơi!"); return false; }
        if (currentUser.dailyLimits[gameKey] >= 1) {
          notify("Hôm nay bạn đã dùng hết lượt cho hoạt động này rồi. Mai quay lại nhé! 🌙");
          return false;
        }
        return true;
      };

      const useLimit = (gameKey) => {
        updateUser({
          dailyLimits: { ...currentUser.dailyLimits, [gameKey]: currentUser.dailyLimits[gameKey] + 1 }
        });
      };

      // --- AUDIO ENGINE ---
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentSongIndex, setCurrentSongIndex] = useState(0);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const audioRef = useRef(new Audio());

      useEffect(() => {
        if (db.songs.length > 0) {
          const randIdx = Math.floor(Math.random() * db.songs.length);
          setCurrentSongIndex(randIdx);
          audioRef.current.src = db.songs[randIdx].url;
        }
      }, []);

      useEffect(() => {
        const audio = audioRef.current;
        const updateTime = () => setCurrentTime(audio.currentTime);
        const updateDuration = () => setDuration(audio.duration || 0);
        const handleEnded = () => {
          setCurrentSongIndex(prev => {
            const next = (prev + 1) % db.songs.length;
            audio.src = db.songs[next].url;
            audio.play().catch(() => setIsPlaying(false));
            return next;
          });
        };
        audio.addEventListener("timeupdate", updateTime);
        audio.addEventListener("loadedmetadata", updateDuration);
        audio.addEventListener("ended", handleEnded);
        return () => {
          audio.removeEventListener("timeupdate", updateTime);
          audio.removeEventListener("loadedmetadata", updateDuration);
          audio.removeEventListener("ended", handleEnded);
        };
      }, [db.songs]);

      const togglePlay = () => {
        if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); } 
        else { audioRef.current.play().then(() => setIsPlaying(true)).catch(() => notify("Nhấp lại đĩa nhạc để phát âm thanh!")); }
      };
      const playSong = (index) => { setCurrentSongIndex(index); audioRef.current.src = db.songs[index].url; audioRef.current.play().then(() => setIsPlaying(true)); };

      // --- LOST ITEMS ENGINE ---
      const [lostItem, setLostItem] = useState(null);
      useEffect(() => {
        if (!currentUser || activeTab === "admin") return;
        const limits = currentUser.dailyLimits;
        if (limits.lostItemsCaught >= limits.lostItemsMaxForToday) return;

        const timer = setInterval(() => {
          if (Math.random() > 0.5 && !lostItem) {
            const items = ["🍃", "🗝️", "🌸", "🐈", "⭐", "🎵", "🦋"];
            setLostItem({
              id: Date.now(),
              icon: items[Math.floor(Math.random() * items.length)],
              top: Math.floor(Math.random() * 70 + 15) + "%",
              left: Math.floor(Math.random() * 70 + 15) + "%"
            });
            // Tồn tại 5-8s rồi biến mất
            setTimeout(() => setLostItem(null), Math.random() * 3000 + 5000);
          }
        }, 12000);
        return () => clearInterval(timer);
      }, [currentUser, lostItem, activeTab]);

      const collectLostItem = () => {
        addLoc(5, "Tìm thấy vật thất lạc!");
        updateUser({
          dailyLimits: { ...currentUser.dailyLimits, lostItemsCaught: currentUser.dailyLimits.lostItemsCaught + 1 }
        });
        setLostItem(null);
      };

      const handleAuth = (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const email = fd.get("email");
        const password = fd.get("password");
        const name = fd.get("name");

        if (authMode === "admin") {
          if (password === "bhnt2006") {
            setIsAdmin(true); setShowAuthModal(false); setActiveTab("admin"); notify("Đăng nhập Admin thành công!");
          } else { notify("Mật khẩu Admin sai!"); }
        } else if (authMode === "register") {
          if (db.users.find(u => u.email === email)) return notify("Email đã tồn tại!");
          const newUser = createNewUser(email, password, name || "Khách Mới");
          setDb(prev => ({ ...prev, users: [...prev.users, newUser] }));
          setCurrentUser(newUser); setShowAuthModal(false); notify("Đăng ký thành công!");
        } else {
          const user = db.users.find(u => u.email === email && u.password === password);
          if (user) { setCurrentUser(user); setShowAuthModal(false); notify("Đăng nhập thành công!"); }
          else { notify("Sai email hoặc mật khẩu!"); }
        }
      };

      const isDark = theme === "dark";
      const bgClasses = isDark ? "bg-slate-950 text-indigo-100" : "bg-emerald-50/70 text-slate-800";
      const cardBg = isDark ? "bg-slate-900/80 border-slate-800 backdrop-blur-md" : "bg-white/85 border-emerald-100/80 backdrop-blur-md shadow-sm";

      return (
        <div className={`min-h-screen relative overflow-x-hidden ${bgClasses}`}>
          {/* Particles */}
          {!isDark ? (
            <>
              <div className="leaf-particle" style={{ left: "10%", animationDelay: "0s" }}>🍃</div>
              <div className="leaf-particle" style={{ left: "35%", animationDelay: "4s" }}>🌸</div>
              <div className="leaf-particle" style={{ left: "65%", animationDelay: "2s" }}>🍃</div>
            </>
          ) : (
            <>
              <div className="firefly-particle bg-yellow-300 w-2 h-2" style={{ top: "20%", left: "15%", boxShadow: "0 0 10px #fef08a" }}></div>
              <div className="firefly-particle bg-yellow-300 w-1.5 h-1.5" style={{ top: "60%", left: "45%", animationDelay: "2s" }}></div>
            </>
          )}

          {/* Lost Item */}
          {lostItem && (
            <button onClick={collectLostItem} style={{ top: lostItem.top, left: lostItem.left }} className="fixed z-40 text-2xl p-2 bg-white/40 dark:bg-slate-800/60 rounded-full shadow-lg hover:scale-125 transition-transform animate-bounce">
              {lostItem.icon}
            </button>
          )}

          {/* Notification */}
          {notification && (
            <div className="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 px-5 py-2.5 bg-emerald-600 dark:bg-indigo-600 text-white rounded-full shadow-xl text-sm font-medium animate-pulse">
              {notification}
            </div>
          )}

          {/* HEADER */}
          <header className={`border-b sticky top-0 z-30 ${isDark ? "border-slate-800 bg-slate-950/80" : "border-emerald-100 bg-white/80"} backdrop-blur-md`}>
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab("rooms")}>
                <div className="w-11 h-11 rounded-full overflow-hidden border-2 border-emerald-400 bg-emerald-100">
                  <img src="ChatGPT_Image_21_56_27_31_thg_7__2026-removebg-preview.png" alt="Logo" onError={(e)=>e.target.src="https://api.dicebear.com/7.x/bottts/svg?seed=MeoLogo"} className="w-full h-full object-cover" />
                </div>
                <div>
                  <h1 className="font-bold text-lg text-emerald-800 dark:text-indigo-200">Quán trọ nhà Mèo</h1>
                  <p className="text-xs opacity-80">Nơi dừng chân thảnh thơi</p>
                </div>
              </div>

              <nav className="hidden md:flex items-center gap-1">
                {[
                  { id: "rooms", label: "Phòng Trọ", icon: "🚪" },
                  { id: "house", label: "Nhà Riêng", icon: "🏡" },
                  { id: "games", label: "Góc Giải Trí", icon: "🎮" },
                  { id: "shop", label: "Cửa Hàng", icon: "🛍️" },
                  ...(isAdmin ? [{ id: "admin", label: "Quản Trị", icon: "⚙️" }] : [])
                ].map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-1 ${activeTab === tab.id ? (isDark ? "bg-indigo-600 text-white" : "bg-emerald-600 text-white") : "hover:bg-black/5 dark:hover:bg-white/5 opacity-80"}`}>
                    {tab.icon} {tab.label}
                  </button>
                ))}
              </nav>

              <div className="flex items-center gap-2.5">
                {currentUser && (
                  <div className={`flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold border ${isDark ? "bg-slate-900 border-indigo-900/60 text-yellow-300" : "bg-emerald-100/70 border-emerald-200 text-emerald-800"}`}>
                    🍀 {currentUser.loc}
                  </div>
                )}
                <button onClick={() => setTheme(isDark ? "light" : "dark")} className="p-2 rounded-full hover:bg-black/5 text-sm">{isDark ? "🌙" : "☀️"}</button>
                
                {currentUser ? (
                  <div className="flex items-center gap-2">
                    <img src={currentUser.avatar} className="w-8 h-8 rounded-full border border-emerald-500" />
                    <button onClick={() => { setCurrentUser(null); setIsAdmin(false); setActiveTab("rooms"); }} className="text-xs px-2 py-1 rounded-lg bg-rose-500/20 text-rose-500 font-bold">Thoát</button>
                  </div>
                ) : (
                  <button onClick={() => { setAuthMode("login"); setShowAuthModal(true); }} className="text-xs px-3 py-1.5 rounded-lg bg-emerald-600 text-white font-bold">Đăng nhập Khách</button>
                )}
                {!isAdmin && (
                  <button onClick={() => { setAuthMode("admin"); setShowAuthModal(true); }} className="text-xs opacity-50 hover:opacity-100">Admin</button>
                )}
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-8 pb-28">
            {activeTab === "rooms" && <RoomsView db={db} setDb={setDb} notify={notify} cardBg={cardBg} isDark={isDark} currentUser={currentUser} />}
            {activeTab === "house" && <HouseView db={db} currentUser={currentUser} updateUser={updateUser} notify={notify} cardBg={cardBg} isDark={isDark} />}
            {activeTab === "games" && <MiniGamesView db={db} setDb={setDb} currentUser={currentUser} updateUser={updateUser} addLoc={addLoc} checkLimit={checkLimit} useLimit={useLimit} notify={notify} cardBg={cardBg} isDark={isDark} />}
            {activeTab === "shop" && <ShopView db={db} currentUser={currentUser} updateUser={updateUser} notify={notify} cardBg={cardBg} isDark={isDark} />}
            {activeTab === "admin" && isAdmin && <AdminView db={db} setDb={setDb} notify={notify} cardBg={cardBg} isDark={isDark} />}
          </main>

          {/* MUSIC PLAYER */}
          <div className="fixed bottom-6 right-6 z-40 flex flex-col items-end">
            {isPlaying && <div className="relative w-12 h-6 pointer-events-none mb-1 text-emerald-500 font-bold"><span className="absolute left-2 animate-float-1">🎵</span><span className="absolute right-2 animate-float-2">🎶</span></div>}
            <div className="flex items-center gap-2">
              <button onClick={() => setShowMusicDrawer(!showMusicDrawer)} className={`p-2.5 rounded-full shadow-lg ${isDark ? "bg-slate-800" : "bg-white"} text-xl`}>📻</button>
              <div onClick={togglePlay} className={`w-14 h-14 rounded-full border-4 shadow-xl flex items-center justify-center cursor-pointer ${isDark ? "border-slate-800 bg-slate-900" : "border-emerald-100 bg-slate-900"} ${isPlaying ? "animate-spin-slow" : ""}`}>
                <div className="w-10 h-10 rounded-full border border-slate-700 flex items-center justify-center">
                  <div className="w-5 h-5 rounded-full bg-amber-600 flex items-center justify-center text-[9px] text-white font-bold">{isPlaying ? "⏸" : "▶"}</div>
                </div>
              </div>
            </div>
            {showMusicDrawer && (
              <div className={`mt-3 w-80 p-4 rounded-2xl shadow-2xl border ${cardBg}`}>
                <div className="flex justify-between items-center mb-3"><h4 className="font-bold text-sm">Giai Điệu Quán Trọ</h4><button onClick={() => setShowMusicDrawer(false)}>✕</button></div>
                <div className="mb-3 p-2.5 rounded-xl bg-black/5 text-xs font-semibold"><p className="truncate">{db.songs[currentSongIndex]?.title}</p><p className="opacity-70 text-[10px]">{db.songs[currentSongIndex]?.artist}</p></div>
                <input type="range" min="0" max={duration || 100} value={currentTime} onChange={(e) => audioRef.current.currentTime = Number(e.target.value)} className="w-full h-1 bg-slate-300 rounded-lg appearance-none cursor-pointer mb-3 accent-emerald-600" />
                <div className="max-h-40 overflow-y-auto space-y-1 text-xs">
                  {db.songs.map((s, idx) => (
                    <div key={s.id} onClick={() => playSong(idx)} className={`p-2 rounded-lg cursor-pointer flex justify-between ${currentSongIndex === idx ? "bg-emerald-500/20 font-bold" : "hover:bg-black/5"}`}>
                      <span>{s.title}</span><span>{currentSongIndex === idx && isPlaying ? "🎵" : "▶"}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`max-w-sm w-full p-6 rounded-2xl shadow-2xl border ${cardBg}`}>
                <h3 className="font-bold text-lg mb-4 text-center">
                  {authMode === 'admin' ? "Đăng Nhập Quản Trị" : (authMode === 'login' ? "Khách Đăng Nhập" : "Đăng Ký Khách Mới")}
                </h3>
                <form onSubmit={handleAuth} className="space-y-3">
                  {authMode === 'register' && <input name="name" placeholder="Tên của bạn" required className="w-full p-2.5 text-sm rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />}
                  {authMode !== 'admin' && <input name="email" type="email" placeholder="Email" required className="w-full p-2.5 text-sm rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />}
                  <input name="password" type="password" placeholder="Mật khẩu" required className="w-full p-2.5 text-sm rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />
                  
                  <div className="flex justify-between items-center pt-2">
                    {authMode !== 'admin' ? (
                      <button type="button" onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')} className="text-xs text-emerald-600 font-bold underline">
                        {authMode === 'login' ? "Chưa có tài khoản?" : "Đã có tài khoản?"}
                      </button>
                    ) : <div></div>}
                    <div className="flex gap-2">
                      <button type="button" onClick={() => setShowAuthModal(false)} className="px-3 py-2 rounded-xl text-xs bg-black/5 font-bold">Hủy</button>
                      <button type="submit" className="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">Xác nhận</button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // MODULE 1: ROOMS
    // ==========================================
    function RoomsView({ db, setDb, notify, cardBg, isDark, currentUser }) {
      const [sortBy, setSortBy] = useState("newest");
      const handleVote = (roomId) => {
        if (!currentUser) return notify("Vui lòng đăng nhập để chấm hóng!");
        setDb(prev => ({ ...prev, rooms: prev.rooms.map(r => r.id === roomId ? { ...r, votes: r.votes + 1 } : r) }));
        notify("Chấm hóng thành công! 💖");
      };
      const pinnedRooms = db.rooms.filter(r => r.pinRank > 0 && !r.isCompleted).sort((a, b) => a.pinRank - b.pinRank);
      const otherRooms = db.rooms.filter(r => r.pinRank === 0 && !r.isCompleted);
      sortBy === "votes" ? otherRooms.sort((a,b) => b.votes - a.votes) : otherRooms.sort((a,b) => b.createdAt - a.createdAt);
      const completedRooms = db.rooms.filter(r => r.isCompleted).sort((a,b) => b.votes - a.votes);

      return (
        <div className="space-y-8">
          <div className={`p-8 rounded-3xl border ${cardBg} text-center space-y-2`}>
            <span className="text-3xl">🌸 🍃</span>

    // ==========================================
    // MODULE 2: INTERACTIVE HOUSE & GARDEN (Drag & Drop)
    // ==========================================
    function HouseView({ db, currentUser, updateUser, notify, cardBg }) {
      if (!currentUser) return <div className="text-center p-10 font-bold">Vui lòng đăng nhập để xem Nhà Riêng.</div>;

      const [customName, setCustomName] = useState("");
      const [showRename, setShowRename] = useState(false);
      const [dragItem, setDragItem] = useState(null);

      // Map owned item IDs to Shop Item details
      const inventoryDetails = currentUser.inventory.map(invId => db.shopItems.find(s => s.id === invId)).filter(Boolean);

      const handleRename = (e) => {
        e.preventDefault();
        const cost = currentUser.hasCustomHouseName ? 20 : 0;
        if (currentUser.loc < cost) return notify("Không đủ Lộc!");
        updateUser({ houseName: customName, hasCustomHouseName: true, loc: currentUser.loc - cost });
        setShowRename(false); notify("Đổi tên biển nhà thành công!");
      };

      const handleDragStart = (e, item, isFromInventory, placedUid = null) => {
        e.dataTransfer.setData("text/plain", item.id);
        setDragItem({ ...item, isFromInventory, placedUid });
      };

      const handleDragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add("drag-over"); };
      const handleDragLeave = (e) => { e.currentTarget.classList.remove("drag-over"); };

      const handleDrop = (e, areaName) => {
        e.preventDefault();
        e.currentTarget.classList.remove("drag-over");
        if (!dragItem) return;

        const rect = e.currentTarget.getBoundingClientRect();
        // Calculate percentages to make it responsive
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;

        let newPlaced = [...currentUser.placedItems];
        if (dragItem.isFromInventory) {
          // Add new item
          newPlaced.push({ uid: Date.now().toString(), shopId: dragItem.id, x, y, area: areaName });
          // Remove from inventory
          updateUser({
            placedItems: newPlaced,
            inventory: currentUser.inventory.filter((_, idx) => idx !== currentUser.inventory.indexOf(dragItem.id))
          });
        } else {
          // Move existing item
          const idx = newPlaced.findIndex(p => p.uid === dragItem.placedUid);
          if (idx !== -1) {
            newPlaced[idx] = { ...newPlaced[idx], x, y, area: areaName };
            updateUser({ placedItems: newPlaced });
          }
        }
        setDragItem(null);
      };

      const handleStoreItem = (placedUid, shopId) => {
        updateUser({
          placedItems: currentUser.placedItems.filter(p => p.uid !== placedUid),
          inventory: [...currentUser.inventory, shopId]
        });
        notify("Đã cất vật phẩm vào kho");
      };

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className={`p-5 rounded-3xl border ${cardBg} flex justify-between items-center`}>
            <div className="flex items-center gap-3">
              <span className="text-4xl">🏡</span>
              <div>
                <h2 className="text-xl font-black text-amber-700 dark:text-amber-400">[Biển Tên]: {currentUser.houseName}</h2>
                <button onClick={() => setShowRename(true)} className="text-[10px] font-bold px-2 py-0.5 bg-amber-500/20 text-amber-700 rounded mt-1">✏️ Đổi tên {currentUser.hasCustomHouseName ? "(20🍀)" : "(Free)"}</button>
              </div>
            </div>
            <p className="text-xs font-bold opacity-70">Chủ nhà: {currentUser.name}</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">
            {/* Inventory Sidebar */}
            <div className={`p-4 rounded-3xl border ${cardBg} lg:col-span-1 h-96 overflow-y-auto space-y-3`}>
              <h3 className="font-bold text-sm">Kho Đồ Của Bạn</h3>
              <p className="text-[10px] opacity-70">Kéo vật phẩm thả vào Nhà hoặc Sân để trang trí.</p>
              <div className="grid grid-cols-2 gap-2">
                {inventoryDetails.map((item, idx) => (
                  <div key={idx} draggable onDragStart={(e) => handleDragStart(e, item, true)} className="p-2 border rounded-xl bg-black/5 flex flex-col items-center cursor-grab hover:bg-emerald-500/20">
                    <span className="text-3xl">{item.icon}</span>
                    <span className="text-[9px] font-bold text-center mt-1 truncate w-full">{item.name}</span>
                  </div>
                ))}
                {inventoryDetails.length === 0 && <p className="text-[10px] col-span-2 text-center py-4 opacity-50">Kho trống. Hãy mua ở Cửa hàng!</p>}
              </div>
            </div>

            {/* Decorating Canvas */}
            <div className="lg:col-span-3 space-y-4">
              {/* House Area */}
              <div 
                className="h-64 rounded-3xl border-2 border-dashed border-amber-900/20 bg-amber-900/5 relative overflow-hidden transition-colors"
                onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={(e) => handleDrop(e, 'house')}
              >
                <div className="absolute top-2 left-4 text-xs font-bold opacity-50">Khu Vực Trong Nhà 🛋️</div>
                {currentUser.placedItems.filter(p => p.area === 'house').map(p => {
                  const item = db.shopItems.find(s => s.id === p.shopId);
                  if (!item) return null;
                  return (
                    <div key={p.uid} draggable onDragStart={(e) => handleDragStart(e, item, false, p.uid)} onDoubleClick={() => handleStoreItem(p.uid, p.shopId)} className="absolute cursor-grab text-4xl hover:scale-110 transition-transform flex flex-col items-center" style={{ left: `${p.x}%`, top: `${p.y}%`, transform: 'translate(-50%, -50%)' }} title="Nhấp đúp để cất đi">
                      {item.image ? <img src={item.image} className="w-12 h-12 object-contain pointer-events-none" /> : <span>{item.icon}</span>}
                    </div>
                  );
                })}
              </div>

              {/* Garden Area */}
              <div 
                className="h-64 rounded-3xl border-2 border-dashed border-emerald-900/20 bg-emerald-900/5 relative overflow-hidden transition-colors"
                onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={(e) => handleDrop(e, 'garden')}
              >
                <div className="absolute top-2 left-4 text-xs font-bold opacity-50">Khu Vực Sân Vườn 🌿</div>
                {currentUser.placedItems.filter(p => p.area === 'garden').map(p => {
                  const item = db.shopItems.find(s => s.id === p.shopId);
                  if (!item) return null;
                  return (
                    <div key={p.uid} draggable onDragStart={(e) => handleDragStart(e, item, false, p.uid)} onDoubleClick={() => handleStoreItem(p.uid, p.shopId)} className="absolute cursor-grab text-4xl hover:scale-110 transition-transform flex flex-col items-center" style={{ left: `${p.x}%`, top: `${p.y}%`, transform: 'translate(-50%, -50%)' }} title="Nhấp đúp để cất đi">
                      {item.image ? <img src={item.image} className="w-12 h-12 object-contain pointer-events-none" /> : <span>{item.icon}</span>}
                    </div>
                  );
                })}
              </div>
              <p className="text-[10px] text-center opacity-60 italic">Nhấp đúp vào vật phẩm đang trang trí để cất lại vào kho.</p>
            </div>
          </div>

          {showRename && (
            <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
              <form onSubmit={handleRename} className={`p-6 rounded-2xl w-full max-w-sm border ${cardBg}`}>
                <h3 className="font-bold mb-3">Đổi Tên Biển Nhà</h3>
                <input value={customName} onChange={(e) => setCustomName(e.target.value)} required className="w-full p-2 text-sm rounded border bg-transparent mb-4" placeholder="VD: Hiên Nhà Gió Mát..." />
                <div className="flex gap-2"><button type="button" onClick={()=>setShowRename(false)} className="flex-1 py-2 bg-black/10 rounded font-bold text-xs">Hủy</button><button type="submit" className="flex-1 py-2 bg-emerald-600 text-white rounded font-bold text-xs">Lưu Tên</button></div>
              </form>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // MODULE 3: 8 MINI-GAMES WITH DAILY LIMITS
    // ==========================================
    function MiniGamesView({ db, setDb, currentUser, addLoc, checkLimit, useLimit, notify, cardBg }) {
      const [currentGame, setCurrentGame] = useState(1);
      const games = [
        { id: 1, name: "Chăm Vườn", icon: "🌱" }, { id: 2, name: "Câu Cá", icon: "🎣" },

            {currentGame === 2 && <GameGeneric title="🎣 Câu Cá Bên Suối" desc="Mỗi ngày thả câu 1 lần xem được cá gì nào!" action="Thả Câu" limitKey="fish" reward={15} checkLimit={checkLimit} useLimit={useLimit} addLoc={addLoc} currentUser={currentUser} display="🌊 Róc rách róc rách..." isGacha />}
            {currentGame === 3 && <GameGeneric title="🌙 Đặt Tên Chòm Sao" desc="Mỗi đêm, bầu trời sẽ tặng bạn 1 chòm sao để đặt tên." action="Đặt Tên Sao (+20 🍀)" limitKey="star" reward={20} checkLimit={checkLimit} useLimit={useLimit} addLoc={addLoc} currentUser={currentUser} display="✨ Bầu trời đầy sao chờ bạn..." />}
            
            {/* Các game có input text/logic đặc thù */}
            {currentGame === 4 && <DiaryGame currentUser={currentUser} checkLimit={checkLimit} useLimit={useLimit} addLoc={addLoc} db={db} setDb={setDb} notify={notify} />}
            {currentGame === 5 && <StoryGame currentUser={currentUser} checkLimit={checkLimit} useLimit={useLimit} addLoc={addLoc} db={db} setDb={setDb} notify={notify} />}
            {currentGame === 6 && <QuizGame currentUser={currentUser} checkLimit={checkLimit} useLimit={useLimit} addLoc={addLoc} db={db} notify={notify} />}
            {currentGame === 7 && <GameGeneric title="🍵 Góc Pha Trà" desc="Pha 1 bình trà thảo mộc mỗi ngày." action="Pha Trà (+20 🍀)" limitKey="tea" reward={20} checkLimit={checkLimit} useLimit={useLimit} addLoc={addLoc} currentUser={currentUser} display="🫖 Đang đun nước..." />}

    // Generic Component for simple 1-click games to save space
    function GameGeneric({ title, desc, action, limitKey, reward, checkLimit, useLimit, addLoc, currentUser, display, isGacha }) {
      const isPlayed = currentUser?.dailyLimits?.[limitKey] >= 1;
      const handlePlay = () => {
        if (!checkLimit(limitKey)) return;
        useLimit(limitKey);
        if (isGacha) {
          const fishes = ["Cá Bảy Màu (Thường) 🐟", "Cá Chép Vàng (Hiếm) 🐠", "Cá Thần Suối Băng ✨"];
          const caught = fishes[Math.floor(Math.random() * fishes.length)];
          addLoc(reward, `Câu được ${caught}`);
        } else {
          addLoc(reward, `Tham gia ${title}`);
        }
      };
      return (
        <div className="text-center space-y-4 max-w-sm mx-auto py-4">
          <h3 className="font-bold text-lg">{title}</h3>
          <p className="text-xs opacity-75">{desc}</p>
          <div className="h-24 bg-black/5 dark:bg-white/5 rounded-xl flex items-center justify-center font-bold">{display}</div>
          <button onClick={handlePlay} disabled={isPlayed} className={`px-6 py-2.5 rounded-2xl text-xs font-bold shadow ${isPlayed ? 'bg-slate-400 text-slate-200 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-500 text-white active:scale-95'}`}>
            {isPlayed ? "Đã dùng lượt hôm nay" : action}
          </button>
        </div>
      );
    }

    function DiaryGame({ currentUser, checkLimit, useLimit, addLoc, db, setDb, notify }) {
      const [input, setInput] = useState("");
      const isPlayed = currentUser?.dailyLimits?.diary >= 1;
      const submit = (e) => {
        e.preventDefault();
        if (!checkLimit("diary")) return;
        if (!input.trim()) return;
        const newEntry = { id: Date.now(), author: currentUser.name, text: input.trim() };
        setDb(prev => ({ ...prev, users: prev.users.map(u => u.id === currentUser.id ? {...u, diaryEntries: [newEntry, ...u.diaryEntries]} : u) }));
        useLimit("diary"); addLoc(15, "Viết nhật ký"); setInput("");
      };
      return (
        <div className="max-w-md mx-auto space-y-4 text-center">
          <h3 className="font-bold text-lg">📖 Nhật Ký Nhà Trọ</h3>
          <p className="text-xs">Viết 1 dòng nhật ký mỗi ngày (Công khai).</p>
          <form onSubmit={submit} className="flex gap-2">
            <input value={input} onChange={e=>setInput(e.target.value)} disabled={isPlayed} placeholder="Hôm nay bạn thế nào?" className="flex-1 p-2 text-xs border rounded-xl bg-transparent" />
            <button type="submit" disabled={isPlayed} className={`px-4 text-xs font-bold rounded-xl ${isPlayed?'bg-slate-400 text-white':'bg-emerald-600 text-white'}`}>{isPlayed?"Xong":"Lưu"}</button>
          </form>
        </div>
      );
    }

    function StoryGame({ currentUser, checkLimit, useLimit, addLoc, db, setDb, notify }) {
      const [input, setInput] = useState("");
      const isPlayed = currentUser?.dailyLimits?.story >= 1;
      // Get all stories from all users for community feel
      const allStories = db.users.flatMap(u => u.storyChapters || []).sort((a,b) => b.id - a.id).slice(0, 5);
      const submit = (e) => {
        e.preventDefault();
        if (!checkLimit("story") || !input.trim()) return;
        const newChap = { id: Date.now(), author: currentUser.name, text: input.trim() };
        setDb(prev => ({ ...prev, users: prev.users.map(u => u.id === currentUser.id ? {...u, storyChapters: [newChap, ...(u.storyChapters||[])]} : u) }));
        useLimit("story"); addLoc(15, "Viết truyện"); setInput("");
      };
      return (
        <div className="max-w-md mx-auto space-y-4 text-center">
          <h3 className="font-bold text-lg">📜 Truyện Nối Tiếp</h3>
          <div className="h-32 p-3 bg-black/5 overflow-y-auto text-left text-xs space-y-1 rounded-xl">
            {allStories.map(s => <p key={s.id}><b>[{s.author}]:</b> {s.text}</p>)}
          </div>
          <form onSubmit={submit} className="flex gap-2">
            <input value={input} onChange={e=>setInput(e.target.value)} disabled={isPlayed} placeholder="Tiếp tục câu chuyện..." className="flex-1 p-2 text-xs border rounded-xl bg-transparent" />
            <button type="submit" disabled={isPlayed} className={`px-4 text-xs font-bold rounded-xl ${isPlayed?'bg-slate-400 text-white':'bg-emerald-600 text-white'}`}>Viết</button>
          </form>
        </div>
      );
    }

    function QuizGame({ currentUser, checkLimit, useLimit, addLoc, db, notify }) {
      const isPlayed = currentUser?.dailyLimits?.quiz >= 1;
      // Daily random quiz logic based on date
      const todayNum = new Date().getDate();
      const quiz = db.quizzes.length > 0 ? db.quizzes[todayNum % db.quizzes.length] : { q: "Chưa có câu hỏi", options: [], ansIdx: -1 };

      const answer = (idx) => {
        if (!checkLimit("quiz")) return;
        useLimit("quiz");
        if (idx === quiz.ansIdx) { addLoc(20, "Trả lời đúng câu đố!"); } 
        else { notify("Sai rồi, hẹn ngày mai nhé!"); }
      };

      return (
        <div className="max-w-md mx-auto space-y-4 text-center">
          <h3 className="font-bold text-lg">🧩 Câu Đố Mỗi Ngày</h3>
          <p className="text-xs font-bold text-emerald-700 dark:text-indigo-300">"{quiz.q}"</p>
          <div className="grid grid-cols-2 gap-2">
            {quiz.options.map((opt, idx) => (
              <button key={idx} disabled={isPlayed} onClick={() => answer(idx)} className={`p-2 text-xs font-bold rounded-xl border ${isPlayed?'bg-slate-200 text-slate-500':'hover:bg-emerald-100 dark:hover:bg-slate-800'}`}>{opt}</button>
            ))}
          </div>
        </div>
      );
    }


    // ==========================================
    // MODULE 4: SHOP 
    // ==========================================
    function ShopView({ db, currentUser, updateUser, notify, cardBg }) {
      const categories = ["Tất cả", "Nội thất", "Sân vườn", "Cây cối", "Thú cưng", "Hiệu ứng"];
      const [cat, setCat] = useState("Tất cả");

      const buy = (item) => {
        if (!currentUser) return notify("Vui lòng đăng nhập!");
        if (currentUser.loc < item.price) return notify("Không đủ Lộc!");
        updateUser({ loc: currentUser.loc - item.price, inventory: [...currentUser.inventory, item.id] });
        notify(`Đã mua ${item.name}! Xem trong kho nhà riêng.`);
      };

      const filtered = cat === "Tất cả" ? db.shopItems : db.shopItems.filter(i => i.category === cat);
      return (
        <div className="space-y-6">
          <div className={`p-6 rounded-3xl border ${cardBg} flex justify-between items-center`}><h2 className="text-xl font-black">🛍️ Cửa Hàng</h2><div className="font-bold text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">🍀 {currentUser?.loc || 0}</div></div>
          <div className="flex gap-2 overflow-x-auto pb-2">{categories.map(c => <button key={c} onClick={()=>setCat(c)} className={`px-4 py-1.5 rounded-xl text-xs font-bold ${cat===c?'bg-emerald-600 text-white':'bg-black/5'}`}>{c}</button>)}</div>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            {filtered.map(item => (
              <div key={item.id} className={`p-4 rounded-2xl border ${cardBg} text-center space-y-2 flex flex-col items-center justify-between`}>
                {item.image ? <img src={item.image} className="w-16 h-16 object-contain" /> : <span className="text-4xl">{item.icon}</span>}
                <div><h4 className="font-bold text-xs">{item.name}</h4><p className="text-[10px] opacity-60">{item.category}</p></div>
                <button onClick={()=>buy(item)} className="w-full py-1.5 bg-amber-500 text-white text-xs font-bold rounded-lg hover:bg-amber-400">🍀 {item.price}</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE 5: ADMIN FULL CRUD
    // ==========================================
    function AdminView({ db, setDb, notify, cardBg }) {
      const [tab, setTab] = useState("rooms");

      // CRUD Helpers generic
      const handleAdd = (e, key, newItemCreator) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        setDb(prev => ({ ...prev, [key]: [newItemCreator(fd), ...prev[key]] }));
        e.target.reset(); notify("Thêm thành công!");
      };
      const handleDelete = (id, key) => { setDb(prev => ({ ...prev, [key]: prev[key].filter(x => x.id !== id) })); notify("Xóa thành công!"); };

      return (
        <div className="space-y-6">
          <div className={`p-6 rounded-3xl border ${cardBg} flex justify-between items-center`}>
            <h2 className="text-xl font-black">⚙️ Quản Trị Toàn Quyền</h2>
            <div className="flex gap-1">
              {["rooms", "music", "shop", "quiz"].map(t => (
                <button key={t} onClick={()=>setTab(t)} className={`px-3 py-1 rounded text-xs font-bold ${tab===t?'bg-emerald-600 text-white':'bg-black/5'}`}>{t.toUpperCase()}</button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
            {/* Form Column */}
            <div className={`p-5 rounded-3xl border ${cardBg}`}>
              <h3 className="font-bold mb-4">Thêm Dữ Liệu ({tab})</h3>
              
              {tab === "rooms" && (
                <form onSubmit={(e) => handleAdd(e, "rooms", (fd) => ({ id: Date.now(), name: fd.get("name"), image: fd.get("image")||"https://picsum.photos/400", tags: fd.get("tags").split(","), note: fd.get("note"), idea: fd.get("idea"), isCompleted: fd.get("completed")==='on', link: fd.get("link"), pinRank: Number(fd.get("pin")), votes:0, createdAt:Date.now() }))} className="space-y-3">
                  <input name="name" required placeholder="Tên phòng" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <input name="image" placeholder="URL Ảnh" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <input name="tags" placeholder="Tags (cách nhau bằng phẩy)" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <input name="note" placeholder="Ghi chú" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <textarea name="idea" placeholder="Ý tưởng" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <div className="flex gap-2 items-center">
                    <select name="pin" className="flex-1 p-2 text-xs border rounded bg-transparent"><option value="0">Không ghim</option><option value="1">Top 1</option><option value="2">Top 2</option><option value="3">Top 3</option></select>
                    <label className="text-xs font-bold"><input type="checkbox" name="completed" /> Xong</label>
                  </div>
                  <input name="link" placeholder="Link web phòng (nếu Xong)" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <button className="w-full py-2 bg-emerald-600 text-white font-bold rounded">Thêm Phòng</button>
                </form>
              )}

              {tab === "music" && (
                <form onSubmit={(e) => handleAdd(e, "songs", (fd) => ({ id: Date.now(), title: fd.get("title"), artist: fd.get("artist"), url: fd.get("url") }))} className="space-y-3">
                  <input name="title" required placeholder="Tên bài" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <input name="artist" placeholder="Ca sĩ" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <input name="url" required placeholder="Link MP3" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <button className="w-full py-2 bg-emerald-600 text-white font-bold rounded">Thêm Nhạc</button>
                </form>
              )}

              {tab === "shop" && (
                <form onSubmit={(e) => handleAdd(e, "shopItems", (fd) => ({ id: 'item_'+Date.now(), name: fd.get("name"), category: fd.get("cat"), price: Number(fd.get("price")), icon: fd.get("icon"), image: fd.get("img") }))} className="space-y-3">
                  <input name="name" required placeholder="Tên đồ vật" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <select name="cat" className="w-full p-2 text-xs border rounded bg-transparent"><option>Nội thất</option><option>Sân vườn</option><option>Cây cối</option><option>Thú cưng</option><option>Hiệu ứng</option></select>
                  <input name="price" type="number" required placeholder="Giá (Lộc)" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <input name="icon" placeholder="Emoji / Icon" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <input name="img" placeholder="Link ảnh đồ vật (Tùy chọn)" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <button className="w-full py-2 bg-emerald-600 text-white font-bold rounded">Thêm Đồ Shop</button>
                </form>
              )}

              {tab === "quiz" && (
                <form onSubmit={(e) => handleAdd(e, "quizzes", (fd) => ({ id: Date.now(), q: fd.get("q"), options: [fd.get("o1"), fd.get("o2"), fd.get("o3"), fd.get("o4")], ansIdx: Number(fd.get("ans")) }))} className="space-y-3">
                  <input name="q" required placeholder="Câu hỏi?" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <input name="o1" required placeholder="Đáp án 0" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <input name="o2" required placeholder="Đáp án 1" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <input name="o3" required placeholder="Đáp án 2" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <input name="o4" required placeholder="Đáp án 3" className="w-full p-2 text-xs border rounded bg-transparent" />
                  <select name="ans" className="w-full p-2 text-xs border rounded bg-transparent"><option value="0">Đáp án đúng: 0</option><option value="1">Đúng: 1</option><option value="2">Đúng: 2</option><option value="3">Đúng: 3</option></select>
                  <button className="w-full py-2 bg-emerald-600 text-white font-bold rounded">Thêm Câu Hỏi</button>
                </form>
              )}
            </div>

            {/* List Column */}
            <div className={`md:col-span-2 p-5 rounded-3xl border ${cardBg} overflow-y-auto max-h-[600px] space-y-2`}>
              <h3 className="font-bold">Danh Sách Hiện Tại</h3>
              {db[tab === 'quiz' ? 'quizzes' : (tab === 'music' ? 'songs' : (tab === 'shop' ? 'shopItems' : 'rooms'))].map(item => (
                <div key={item.id} className="p-3 bg-black/5 rounded flex justify-between items-center text-xs">
                  <div>
                    <p className="font-bold truncate max-w-[200px]">{item.name || item.title || item.q}</p>
                    <p className="opacity-60">{item.isCompleted ? '✓ Hoàn thành' : (item.artist || item.category || 'Data ID: '+item.id)}</p>
                  </div>
                  <button onClick={() => handleDelete(item.id, tab === 'quiz' ? 'quizzes' : (tab === 'music' ? 'songs' : (tab === 'shop' ? 'shopItems' : 'rooms')))} className="px-3 py-1 bg-rose-500/20 text-rose-500 font-bold rounded hover:bg-rose-500/40">Xóa</button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
