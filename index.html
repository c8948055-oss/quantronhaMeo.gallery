<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quán Trọ Nhà Mèo - Kỷ Nguyên Mới</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes falling-leaf { 0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; } 20% { opacity: 0.8; } 100% { transform: translate(100px, 100vh) rotate(360deg); opacity: 0; } }
    @keyframes pop-in { 0% { transform: scale(0); opacity: 0; } 80% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    
    .animate-spin-slow { animation: spin-slow 8s linear infinite; }
    .animate-pop-in { animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .leaf-particle { position: fixed; pointer-events: none; z-index: 1; animation: falling-leaf 12s linear infinite; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 4px; }

    /* House Drag & Drop Area */
    .house-canvas {
      background-image: url('https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=1000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      position: relative;
    }
  </style>
</head>
<body class="transition-colors duration-500 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- HELPER: CONVERT FILE TO BASE64 ---
    const fileToBase64 = (file, callback) => {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => callback(e.target.result);
      reader.readAsDataURL(file);
    };

    // --- MOCK DATABASE ---
    const INITIAL_DATA = {
      rooms: [
        { id: 1, name: "Phòng Trà Mây Ngủ", image: "https://picsum.photos/seed/room1/600/400", tags: ["Thư giãn"], note: "Có ban công", idea: "Gỗ mộc", isCompleted: false, link: "", votes: 42, pinRank: 1, createdAt: Date.now() - 30000 },
        { id: 5, name: "Căn Nhà Gỗ Cũ", image: "https://picsum.photos/seed/room5/600/400", tags: ["Hoàn thành"], note: "Đã hoạt động", idea: "Căn đầu tiên", isCompleted: true, link: "https://google.com", votes: 89, pinRank: 0, createdAt: Date.now() - 100000 }
      ],
      songs: [
        { id: 1, title: "Khúc Hát Ban Mai", artist: "Mèo Du Ca", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" }
      ],
      quizzes: [
        { id: 1, question: "Loài hoa nào thường nở rộ báo hiệu mùa xuân?", options: ["Hoa Cúc", "Hoa Mai & Đào", "Hướng Dương", "Bồ Công Anh"], correctIndex: 1 }
      ],
      settings: {
        rewards: { water: 25, star: 20, diary: 15, story: 10, quiz: 20, tea: 20, lostItem: 5, fishCommon: 8, fishRare: 15, fishLegend: 40 },
        gameImages: { garden: "", fishing: "", star: "", diary: "", story: "", quiz: "", tea: "" }
      },
      shopItems: [
        { id: "giuong_nem", name: "Giường Nệm", category: "Nội thất", price: 40, icon: "🛏️" },
        { id: "ke_sach", name: "Kệ Sách Cổ", category: "Nội thất", price: 35, icon: "📚" },
        { id: "ho_nuoc", name: "Hồ Nước Nhỏ", category: "Sân vườn", price: 50, icon: "⛲" },
        { id: "meo_cam", name: "Mèo Cam Béo", category: "Thú cưng", price: 80, icon: "🐈" }
      ],
      user: {
        name: "Vị Khách Đáng Yêu",
        avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=catguest",
        loc: 150,
        houseName: "Tổ Ấm Của Mèo",
        houseItems: ["giuong_nem", "ke_sach"], // Inventory
        houseLayout: [], // Items placed in canvas: { id, uniqueId, icon, x, y }
        checkInStreak: 3,
        lastCheckIn: null,
        diaryEntries: [],
        storyChapters: [],
        gardenProgress: 0,
        daily: { date: "", water: 0, fish: 0, star: 0, diary: 0, story: 0, tea: 0, quiz: 0, lostItemsFound: 0, maxLostItems: 6 }
      }
    };

    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem("theme") || "light");
      const [db, setDb] = useState(() => {
        const saved = localStorage.getItem("quan_tro_db_v2");
        return saved ? JSON.parse(saved) : INITIAL_DATA;
      });
      const [activeTab, setActiveTab] = useState("rooms"); // rooms | house | games | shop | admin
      const [isAdmin, setIsAdmin] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [notification, setNotification] = useState("");

      // RESET DAILY AT 00:00
      useEffect(() => {
        const todayStr = new Date().toDateString();
        if (db.user.daily?.date !== todayStr) {
          const maxLost = Math.floor(Math.random() * 5) + 6;
          setDb(prev => ({
            ...prev,
            user: { ...prev.user, daily: { date: todayStr, water: 0, fish: 0, star: 0, diary: 0, story: 0, tea: 0, quiz: 0, lostItemsFound: 0, maxLostItems: maxLost } }
          }));
        }
      }, []);

      // SAVE DB
      useEffect(() => { localStorage.setItem("quan_tro_db_v2", JSON.stringify(db)); }, [db]);
      useEffect(() => { localStorage.setItem("theme", theme); }, [theme]);

      const notify = (msg) => { setNotification(msg); setTimeout(() => setNotification(""), 3500); };
      const addLoc = (amount, reason) => {
        setDb(prev => ({ ...prev, user: { ...prev.user, loc: prev.user.loc + amount } }));
        notify(`🍀 +${amount} Lộc (${reason})`);
      };

      // AUDIO
      const [isPlaying, setIsPlaying] = useState(false);
      const audioRef = useRef(new Audio());
      useEffect(() => { if (db.songs.length > 0) audioRef.current.src = db.songs[0].url; }, [db.songs]);
      const togglePlay = () => {
        if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); } 
        else if (db.songs.length > 0) audioRef.current.play().then(() => setIsPlaying(true)).catch(()=>notify("Hãy nhấp vào trang 1 lần trước khi phát nhạc!"));
      };

      // CHECK-IN
      const handleCheckIn = () => {
        const today = new Date().toDateString();
        if (db.user.lastCheckIn === today) return notify("Hôm nay bạn đã ghé rồi!");
        setDb(prev => ({ ...prev, user: { ...prev.user, loc: prev.user.loc + 20, lastCheckIn: today } }));
        notify("🎉 Nhận +20 🍀 Lộc ghé thăm!");
      };

      // UPLOAD AVATAR
      const handleAvatarChange = (e) => {
        fileToBase64(e.target.files[0], (base64Str) => {
          setDb(prev => ({ ...prev, user: { ...prev.user, avatar: base64Str } }));
          notify("Đã thay đổi ảnh đại diện!");
        });
      };

      const isDark = theme === "dark";
      const bgClasses = isDark ? "bg-slate-950 text-indigo-100" : "bg-emerald-50 text-slate-800";
      const cardBg = isDark ? "bg-slate-900/80 border-slate-800 backdrop-blur-md" : "bg-white/90 border-emerald-100/80 backdrop-blur-md shadow-sm";

      return (
        <div className={`min-h-screen relative overflow-x-hidden ${bgClasses}`}>
          {!isDark && <div className="leaf-particle" style={{ left: "10%", animationDelay: "0s" }}>🍃</div>}

          {/* Toast */}
          {notification && (
            <div className="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 px-5 py-2.5 bg-emerald-600 text-white rounded-full shadow-xl text-sm font-bold animate-pulse">
              {notification}
            </div>
          )}

          {/* HEADER CHÍNH */}
          <header className={`border-b sticky top-0 z-30 ${isDark ? "border-slate-800 bg-slate-950/90" : "border-emerald-100 bg-white/90"} backdrop-blur-md`}>
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              
              {/* CỤM AVATAR & USER (Bên Trái) */}
              <div className="flex items-center gap-3">
                <label className="cursor-pointer relative group">
                  <div className="w-12 h-12 rounded-full overflow-hidden border-2 border-emerald-400 bg-emerald-100">
                    <img src={db.user.avatar} className="w-full h-full object-cover" alt="Avatar" />
                  </div>
                  <div className="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                    <span className="text-white text-[10px] font-bold">Đổi ảnh</span>
                  </div>
                  <input type="file" accept="image/*" className="hidden" onChange={handleAvatarChange} />
                </label>
                <div>
                  <input 
                    value={db.user.name} 
                    onChange={e => setDb(prev => ({...prev, user: {...prev.user, name: e.target.value}}))}
                    className="font-bold text-lg tracking-wide text-emerald-800 dark:text-indigo-200 bg-transparent outline-none w-32 md:w-48"
                  />
                  <p className="text-xs text-emerald-600 dark:text-indigo-400">Chủ nhà</p>
                </div>
              </div>

              {/* NAV DESKTOP */}
              <nav className="hidden lg:flex items-center gap-1">
                {[
                  { id: "rooms", label: "Phòng", icon: "🚪" },
                  { id: "house", label: "Nhà Của Tôi", icon: "🏡" },
                  { id: "games", label: "Góc Thư Giãn", icon: "🎮" },
                  { id: "shop", label: "Cửa Hàng", icon: "🛍️" },
                  ...(isAdmin ? [{ id: "admin", label: "Quản Trị", icon: "⚙️" }] : [])
                ].map(tab => (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`px-3 py-1.5 rounded-full text-xs font-bold transition-all flex items-center gap-1 ${activeTab === tab.id ? (isDark ? "bg-indigo-600 text-white" : "bg-emerald-600 text-white") : "hover:bg-black/5 dark:hover:bg-white/5 opacity-80"}`}>
                    <span>{tab.icon}</span> <span>{tab.label}</span>
                  </button>
                ))}
              </nav>

              {/* CONTROLS */}
              <div className="flex items-center gap-2">
                <div className={`px-3 py-1.5 rounded-full text-xs font-bold border ${isDark ? "bg-slate-900 border-indigo-900 text-yellow-300" : "bg-emerald-100/70 border-emerald-200 text-emerald-800"}`}>
                  🍀 {db.user.loc}
                </div>
                <button onClick={handleCheckIn} className={`hidden md:block px-3 py-1.5 rounded-full text-xs font-bold shadow ${isDark ? "bg-amber-600 text-white" : "bg-amber-500 text-white"}`}>🍀 Ghé Trọ</button>
                <button onClick={() => setTheme(isDark ? "light" : "dark")} className="p-2 rounded-full hover:bg-black/5 text-sm">{isDark ? "🌙" : "☀️"}</button>
                {!isAdmin ? (
                  <button onClick={() => setShowLoginModal(true)} className="text-xs px-2.5 py-1.5 border border-slate-300 rounded-lg">Admin</button>
                ) : (
                  <button onClick={() => { setIsAdmin(false); setActiveTab("rooms"); notify("Đã thoát Admin"); }} className="text-xs px-2.5 py-1.5 bg-rose-500/20 text-rose-500 font-bold rounded-lg">Thoát</button>
                )}
              </div>
            </div>

            {/* NAV MOBILE */}
            <div className="flex lg:hidden overflow-x-auto px-4 py-2 gap-2 border-t border-black/5 text-xs">
              <button onClick={() => setActiveTab("rooms")} className={`px-3 py-1.5 rounded-full whitespace-nowrap ${activeTab === 'rooms' ? 'font-bold bg-emerald-500/20' : ''}`}>🚪 Phòng</button>
              <button onClick={() => setActiveTab("house")} className={`px-3 py-1.5 rounded-full whitespace-nowrap ${activeTab === 'house' ? 'font-bold bg-emerald-500/20' : ''}`}>🏡 Nhà Riêng</button>
              <button onClick={() => setActiveTab("games")} className={`px-3 py-1.5 rounded-full whitespace-nowrap ${activeTab === 'games' ? 'font-bold bg-emerald-500/20' : ''}`}>🎮 Games</button>
              <button onClick={() => setActiveTab("shop")} className={`px-3 py-1.5 rounded-full whitespace-nowrap ${activeTab === 'shop' ? 'font-bold bg-emerald-500/20' : ''}`}>🛍️ Cửa Hàng</button>
              {isAdmin && <button onClick={() => setActiveTab("admin")} className="px-3 py-1.5 rounded-full whitespace-nowrap text-rose-500 font-bold">⚙️ Quản Trị</button>}
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="max-w-6xl mx-auto px-4 py-8 relative z-10 pb-28">
            {activeTab === "rooms" && <RoomsView db={db} setDb={setDb} notify={notify} cardBg={cardBg} isDark={isDark} />}
            {activeTab === "house" && <HouseView db={db} setDb={setDb} notify={notify} cardBg={cardBg} />}
            {activeTab === "games" && <MiniGamesView db={db} setDb={setDb} addLoc={addLoc} notify={notify} cardBg={cardBg} isDark={isDark} fileToBase64={fileToBase64} />}
            {activeTab === "shop" && <ShopView db={db} setDb={setDb} notify={notify} cardBg={cardBg} />}
            {activeTab === "admin" && isAdmin && <AdminView db={db} setDb={setDb} notify={notify} cardBg={cardBg} fileToBase64={fileToBase64} />}
          </main>

          {/* MUSIC DISC */}
          <div className="fixed bottom-6 right-6 z-40 flex flex-col items-end">
            <div onClick={togglePlay} className={`w-14 h-14 rounded-full border-4 cursor-pointer shadow-xl flex items-center justify-center transition-transform hover:scale-105 ${isDark ? "border-slate-800 bg-slate-900" : "border-emerald-100 bg-slate-900"} ${isPlaying ? "animate-spin-slow" : ""}`}>
              <div className="w-10 h-10 rounded-full border border-slate-700 flex items-center justify-center">
                <div className="w-5 h-5 rounded-full bg-amber-600 flex items-center justify-center text-[9px] text-white font-bold">{isPlaying ? "⏸" : "▶"}</div>
              </div>
            </div>
          </div>

          {/* ADMIN LOGIN */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <form className={`max-w-sm w-full p-8 rounded-3xl shadow-2xl border ${cardBg}`} onSubmit={(e) => {
                e.preventDefault();
                if (e.target.pwd.value === "bhnt2006") { setIsAdmin(true); setShowLoginModal(false); setActiveTab("admin"); notify("Mở khóa thành công!"); }
                else notify("Sai mật khẩu!");
              }}>
                <h3 className="font-black text-lg text-center mb-4">🔐 Xác Thực Admin</h3>
                <input name="pwd" type="password" placeholder="Mật khẩu..." className="w-full px-4 py-3 rounded-xl border border-slate-300 bg-transparent mb-4 text-center font-mono tracking-widest" autoFocus />
                <div className="flex gap-2">
                  <button type="button" onClick={() => setShowLoginModal(false)} className="flex-1 py-3 rounded-xl hover:bg-black/10 font-bold text-sm">Hủy</button>
                  <button type="submit" className="flex-1 py-3 bg-emerald-600 text-white rounded-xl shadow font-bold text-sm">Vào</button>
                </div>
              </form>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // MODULE: HOUSE VIEW (KÉO THẢ ĐỒ ĐẠC)
    // ==========================================
    function HouseView({ db, setDb, notify, cardBg }) {
      const handleDragStart = (e, itemData, fromCanvas = false) => {
        e.dataTransfer.setData("application/json", JSON.stringify({ itemData, fromCanvas }));
      };

      const handleDropCanvas = (e) => {
        e.preventDefault();
        const rect = e.currentTarget.getBoundingClientRect();
        const x = e.clientX - rect.left - 25; // center offset
        const y = e.clientY - rect.top - 25;
        
        try {
          const data = JSON.parse(e.dataTransfer.getData("application/json"));
          if (data.fromCanvas) {
            // Move existing item
            setDb(prev => {
              const newLayout = prev.user.houseLayout.map(i => i.uniqueId === data.itemData.uniqueId ? { ...i, x, y } : i);
              return { ...prev, user: { ...prev.user, houseLayout: newLayout } };
            });
          } else {
            // Add new item from inventory
            const newItem = { ...data.itemData, uniqueId: Date.now().toString(), x, y };
            setDb(prev => ({ ...prev, user: { ...prev.user, houseLayout: [...prev.user.houseLayout, newItem] } }));
          }
        } catch (err) {}
      };

      const removeFromCanvas = (uniqueId) => {
        setDb(prev => ({ ...prev, user: { ...prev.user, houseLayout: prev.user.houseLayout.filter(i => i.uniqueId !== uniqueId) } }));
      };

      // Create full inventory list from shop DB
      const inventory = db.user.houseItems.map(itemId => db.shopItems.find(s => s.id === itemId)).filter(Boolean);

      return (
        <div className="space-y-6">
          <div className={`p-6 rounded-3xl border ${cardBg}`}>
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-black">🏡 {db.user.houseName || "Căn Nhà Nhỏ"}</h2>
              <span className="text-xs opacity-70 italic">Kéo thả đồ từ túi đồ vào nhà để trang trí</span>
            </div>

            {/* CANVAS NHÀ */}
            <div 
              className="w-full h-[60vh] md:h-[500px] house-canvas rounded-2xl shadow-inner border border-slate-300 dark:border-slate-700 overflow-hidden relative"
              onDragOver={(e) => e.preventDefault()}
              onDrop={handleDropCanvas}
            >
              <div className="absolute inset-0 bg-black/20 pointer-events-none"></div>
              {db.user.houseLayout.map(item => (
                <div
                  key={item.uniqueId}
                  draggable
                  onDragStart={(e) => handleDragStart(e, item, true)}
                  onDoubleClick={() => removeFromCanvas(item.uniqueId)}
                  className="absolute text-5xl cursor-grab active:cursor-grabbing hover:scale-110 transition-transform drop-shadow-xl"
                  style={{ left: item.x, top: item.y }}
                  title="Kéo để di chuyển, click đúp để cất"
                >
                  {item.icon}
                </div>
              ))}
              {db.user.houseLayout.length === 0 && (
                <div className="absolute inset-0 flex items-center justify-center text-white/50 text-sm font-bold pointer-events-none">
                  Kéo thả đồ đạc vào đây...
                </div>
              )}
            </div>
          </div>

          {/* INVENTORY TÚI ĐỒ */}
          <div className={`p-6 rounded-3xl border ${cardBg}`}>
            <h3 className="font-bold mb-4 text-sm">🎒 Túi Đồ Của Tôi</h3>
            <div className="flex gap-4 overflow-x-auto pb-2">
              {inventory.map((item, idx) => (
                <div
                  key={idx}
                  draggable
                  onDragStart={(e) => handleDragStart(e, item, false)}
                  className="w-20 h-20 shrink-0 bg-black/5 dark:bg-white/5 rounded-2xl border border-dashed border-slate-400 flex flex-col items-center justify-center cursor-grab hover:bg-black/10"
                  title="Kéo thả vào nhà"
                >
                  <span className="text-3xl">{item.icon}</span>
                  <span className="text-[10px] font-bold mt-1 text-center line-clamp-1 w-full px-1">{item.name}</span>
                </div>
              ))}
              {inventory.length === 0 && <p className="text-xs opacity-60">Túi đồ rỗng. Hãy mua thêm đồ ở Cửa Hàng!</p>}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE: ROOMS VIEW
    // ==========================================
    function RoomsView({ db, setDb, notify, cardBg, isDark }) {
      const pinnedRooms = useMemo(() => db.rooms.filter(r => r.pinRank > 0 && !r.isCompleted).sort((a,b)=>a.pinRank-b.pinRank), [db.rooms]);
      const otherRooms = useMemo(() => {
        const un = db.rooms.filter(r => r.pinRank === 0 && !r.isCompleted).sort((a,b)=>b.createdAt-a.createdAt);
        const done = db.rooms.filter(r => r.isCompleted).sort((a,b)=>b.votes-a.votes);
        return [...un, ...done]; // Xếp phòng hoàn thành xuống cuối
      }, [db.rooms]);

      return (
        <div className="space-y-8">
          <div className={`p-8 rounded-3xl border ${cardBg} text-center`}>
            <span className="text-3xl">🌸 🍃 🏡</span>
            <h2 className="text-2xl font-extrabold mt-2">Các Căn Phòng Quán Trọ</h2>
          </div>
          {pinnedRooms.length > 0 && (
            <div className="space-y-4">
              <h3 className="font-bold text-lg">📌 Bảng Ghim</h3>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {pinnedRooms.map(r => <RoomCard key={r.id} room={r} db={db} setDb={setDb} notify={notify} cardBg={cardBg} />)}
              </div>
            </div>
          )}
          <div className="space-y-4 pt-4 border-t border-black/5">
            <h3 className="font-bold text-lg">🚪 Tất Cả Phòng Nghỉ</h3>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {otherRooms.map(r => <RoomCard key={r.id} room={r} db={db} setDb={setDb} notify={notify} cardBg={cardBg} />)}
            </div>
          </div>
        </div>
      );
    }
    
    function RoomCard({ room, db, setDb, notify, cardBg }) {
      return (
        <div className={`rounded-2xl overflow-hidden border ${cardBg} hover:-translate-y-1 transition-transform relative flex flex-col`}>
          {room.pinRank > 0 && <div className="absolute top-2 left-2 z-10 px-2.5 py-1 bg-amber-500 text-white text-[10px] font-bold rounded-full">⭐ Top {room.pinRank}</div>}
          {room.isCompleted && <div className="absolute top-2 right-2 z-10 px-2.5 py-1 bg-emerald-600 text-white text-[10px] font-bold rounded-full">✓ Hoàn Thành</div>}
          <div className="h-40 relative bg-slate-200 dark:bg-slate-800">
            <img src={room.image} className="w-full h-full object-cover" alt="" />
          </div>
          <div className="p-4 flex-1 flex flex-col gap-2">
            <h4 className="font-bold text-sm">{room.name}</h4>
            <p className="text-xs opacity-75"><strong>Ý tưởng:</strong> {room.idea}</p>
            <div className="flex-1"></div>
            <div className="flex justify-between items-center pt-2 border-t border-black/5">
              <span className="text-xs font-bold opacity-80">👀 {room.votes}</span>
              {room.isCompleted ? (
                <a href={room.link} target="_blank" className="px-3 py-1 bg-emerald-600 text-white text-xs font-bold rounded-lg shadow">Ghé →</a>
              ) : (
                <button onClick={()=>{ setDb(p=>({...p, rooms: p.rooms.map(x=>x.id===room.id?{...x,votes:x.votes+1}:x)})); notify("Đã hóng!"); }} className="px-3 py-1 bg-sky-600 text-white text-xs font-bold rounded-lg shadow">🐾 Hóng</button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE: MINI GAMES
    // ==========================================
    function MiniGamesView({ db, setDb, addLoc, notify, cardBg, fileToBase64 }) {
      const [currentGame, setCurrentGame] = useState(1);
      const { daily } = db.user;
      const games = [
        { id: 1, name: "Chăm Vườn", icon: "🌱", d: daily.water },
        { id: 2, name: "Câu Cá", icon: "🎣", d: daily.fish },
        { id: 3, name: "Vườn Sao", icon: "🌙", d: daily.star },
        { id: 4, name: "Nhật Ký", icon: "📖", d: daily.diary },
        { id: 5, name: "Nối Truyện", icon: "📜", d: daily.story },
        { id: 6, name: "Câu Đố", icon: "🧩", d: daily.quiz },
        { id: 7, name: "Pha Trà", icon: "🍵", d: daily.tea }
      ];

      return (
        <div className="space-y-6">
          <div className="flex gap-2 overflow-x-auto pb-2">
            {games.map(g => (
              <button key={g.id} onClick={() => setCurrentGame(g.id)} className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap flex gap-2 border ${currentGame === g.id ? "bg-emerald-600 text-white" : `${cardBg}`} ${g.d >= 1 ? "opacity-50 line-through" : ""}`}>
                <span>{g.icon}</span> <span>{g.name}</span>
              </button>
            ))}
          </div>
          <div className={`p-6 rounded-3xl border ${cardBg}`}>
            {currentGame === 1 && <Game1 db={db} setDb={setDb} addLoc={addLoc} notify={notify} />}
            {currentGame === 2 && <Game2 db={db} setDb={setDb} addLoc={addLoc} notify={notify} />}
            {currentGame === 3 && <Game3 db={db} setDb={setDb} addLoc={addLoc} notify={notify} />}
            {currentGame === 4 && <Game4 db={db} setDb={setDb} addLoc={addLoc} notify={notify} fileToBase64={fileToBase64} />}
            {currentGame === 5 && <Game5 db={db} setDb={setDb} addLoc={addLoc} notify={notify} />}
            {currentGame === 6 && <Game6 db={db} setDb={setDb} addLoc={addLoc} notify={notify} />}
            {currentGame === 7 && <Game7 db={db} setDb={setDb} addLoc={addLoc} notify={notify} />}
          </div>
        </div>
      );
    }
    
    // Components Mini Games (Giữ nguyên logic giới hạn 1 lượt/ngày)
    function GameVisual({ img, emj }) { return img ? <img src={img} className="w-full h-40 object-cover rounded-2xl mb-4" /> : <span className="text-7xl block mb-4 text-center">{emj}</span>; }
    
    function Game1({ db, setDb, addLoc, notify }) {
      return (
        <div className="text-center max-w-md mx-auto">
          <h3 className="font-bold mb-4">🌱 Chăm Vườn</h3>
          <GameVisual img={db.settings.gameImages.garden} emj="🌸" />
          <button onClick={()=>{ if(db.user.daily.water>=1) return notify("Mai tưới tiếp nhé!"); setDb(p=>({...p, user: {...p.user, daily: {...p.user.daily, water:1}}})); addLoc(db.settings.rewards.water, "Tưới nước"); }} className="px-6 py-2 bg-emerald-600 text-white font-bold rounded-xl">Tưới Nước 💧</button>
        </div>
      );
    }
    function Game2({ db, setDb, addLoc, notify }) {
      return (
        <div className="text-center max-w-md mx-auto">
          <h3 className="font-bold mb-4">🎣 Câu Cá</h3>
          <GameVisual img={db.settings.gameImages.fishing} emj="🐟" />
          <button onClick={()=>{ if(db.user.daily.fish>=1) return notify("Mai câu tiếp nhé!"); setDb(p=>({...p, user: {...p.user, daily: {...p.user.daily, fish:1}}})); addLoc(db.settings.rewards.fishCommon, "Câu cá"); }} className="px-6 py-2 bg-sky-600 text-white font-bold rounded-xl">Thả Cần 🎣</button>
        </div>
      );
    }
    function Game3({ db, setDb, addLoc, notify }) {
      return (
        <div className="text-center max-w-md mx-auto">
          <h3 className="font-bold mb-4">🌙 Vườn Sao</h3>
          <GameVisual img={db.settings.gameImages.star} emj="✨" />
          <button onClick={()=>{ if(db.user.daily.star>=1) return notify("Đủ sao hôm nay rồi!"); setDb(p=>({...p, user: {...p.user, daily: {...p.user.daily, star:1}}})); addLoc(db.settings.rewards.star, "Tạo sao"); }} className="px-6 py-2 bg-indigo-600 text-white font-bold rounded-xl">Lưu Chòm Sao ✨</button>
        </div>
      );
    }
    function Game4({ db, setDb, addLoc, notify, fileToBase64 }) {
      const [txt, setTxt] = useState("");
      const [imgB64, setImgB64] = useState("");
      return (
        <div className="max-w-xl mx-auto">
          <h3 className="font-bold text-center mb-4">📖 Nhật Ký</h3>
          <textarea value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Tâm sự đôi lời..." className="w-full p-3 rounded-xl border bg-transparent mb-2" />
          <input type="file" accept="image/*" onChange={(e)=>fileToBase64(e.target.files[0], setImgB64)} className="text-xs mb-3" />
          {imgB64 && <img src={imgB64} className="h-20 rounded-lg mb-2" />}
          <button onClick={()=>{ 
            if(db.user.daily.diary>=1) return notify("Đã viết hôm nay!"); 
            if(!txt) return notify("Hãy viết gì đó!");
            setDb(p=>({...p, user: {...p.user, daily: {...p.user.daily, diary:1}, diaryEntries: [{id:Date.now(), text:txt, img:imgB64, author:p.user.name}, ...p.user.diaryEntries]}}));
            addLoc(db.settings.rewards.diary, "Viết nhật ký"); setTxt(""); setImgB64("");
          }} className="w-full py-2 bg-emerald-600 text-white font-bold rounded-xl">Lưu 🍃</button>
          
          <div className="mt-4 space-y-2 h-40 overflow-y-auto">
            {db.user.diaryEntries.map(e => (
              <div key={e.id} className="p-3 bg-black/5 dark:bg-white/5 rounded-xl">
                <p className="font-bold text-xs">{e.author}</p>
                <p className="text-xs">{e.text}</p>
                {e.img && <img src={e.img} className="mt-2 h-24 rounded-lg object-cover" />}
              </div>
            ))}
          </div>
        </div>
      );
    }
    function Game5({ db, setDb, addLoc, notify }) {
      const [txt, setTxt] = useState("");
      return (
        <div className="max-w-xl mx-auto">
          <h3 className="font-bold text-center mb-4">📜 Nối Truyện</h3>
          <div className="h-40 overflow-y-auto text-xs bg-black/5 p-3 rounded-xl mb-2">
            {db.user.storyChapters.map(c => <p key={c.id}><b>[{c.author}]</b>: {c.text}</p>)}
          </div>
          <div className="flex gap-2">
            <input value={txt} onChange={e=>setTxt(e.target.value)} className="flex-1 p-2 rounded-xl border bg-transparent text-xs" placeholder="Viết tiếp..." />
            <button onClick={()=>{
               if(db.user.daily.story>=1) return notify("Mai nối tiếp nhé!");
               if(!txt) return;
               setDb(p=>({...p, user: {...p.user, daily: {...p.user.daily, story:1}, storyChapters: [...p.user.storyChapters, {id:Date.now(), author: p.user.name, text: txt}]}}));
               addLoc(db.settings.rewards.story, "Nối truyện"); setTxt("");
            }} className="px-4 py-2 bg-amber-600 text-white font-bold rounded-xl text-xs">Viết ✍️</button>
          </div>
        </div>
      );
    }
    function Game6({ db, setDb, addLoc, notify }) {
      const q = db.quizzes[new Date().getDate() % (db.quizzes.length||1)];
      return (
        <div className="text-center max-w-md mx-auto">
          <h3 className="font-bold mb-4">🧩 Câu Đố</h3>
          {q ? <>
            <p className="font-bold text-sm mb-4">Q: {q.question || q.title}</p>
            <div className="grid grid-cols-2 gap-2">
              {q.options.map((opt, i) => (
                <button key={i} onClick={()=>{
                  if(db.user.daily.quiz>=1) return notify("Mai chơi tiếp!");
                  setDb(p=>({...p, user: {...p.user, daily: {...p.user.daily, quiz:1}}}));
                  if(i === q.correctIndex) addLoc(db.settings.rewards.quiz, "Đúng!"); else notify("Sai rồi!");
                }} className="p-2 border rounded-xl text-xs hover:bg-black/5">{opt}</button>
              ))}
            </div>
          </> : <p>Chưa có câu đố</p>}
        </div>
      );
    }
    function Game7({ db, setDb, addLoc, notify }) {
      return (
        <div className="text-center max-w-md mx-auto">
          <h3 className="font-bold mb-4">🍵 Pha Trà</h3>
          <GameVisual img={db.settings.gameImages.tea} emj="🫖" />
          <button onClick={()=>{ if(db.user.daily.tea>=1) return notify("Mai pha tiếp!"); setDb(p=>({...p, user: {...p.user, daily: {...p.user.daily, tea:1}}})); addLoc(db.settings.rewards.tea, "Pha trà"); }} className="px-6 py-2 bg-amber-700 text-white font-bold rounded-xl">Ủ Trà</button>
        </div>
      );
    }

    // ==========================================
    // MODULE: SHOP
    // ==========================================
    function ShopView({ db, setDb, notify, cardBg }) {
      const buy = (item) => {
        if(db.user.loc < item.price) return notify("Không đủ Lộc!");
        setDb(p => ({...p, user: {...p.user, loc: p.user.loc - item.price, houseItems: [...p.user.houseItems, item.id]}}));
        notify(`Đã mua ${item.name} và cất vào Túi Đồ!`);
      };
      return (
        <div className={`p-6 rounded-3xl border ${cardBg}`}>
          <h2 className="text-xl font-black mb-4">🛍️ Cửa Hàng (Số dư: 🍀 {db.user.loc})</h2>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            {db.shopItems.map(i => (
              <div key={i.id} className="p-4 border border-black/10 rounded-xl text-center">
                <span className="text-4xl block mb-2">{i.icon}</span>
                <p className="font-bold text-xs">{i.name}</p>
                <button onClick={()=>buy(i)} className="mt-2 w-full py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-lg shadow">Mua {i.price}🍀</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE: ADMIN (TẤT CẢ TẢI ẢNH BẰNG FILE -> BASE64)
    // ==========================================
    function AdminView({ db, setDb, notify, cardBg, fileToBase64 }) {
      const [tab, setTab] = useState("rooms");
      
      // STATE PHÒNG
      const [rName, setRName] = useState(""); const [rImgB64, setRImgB64] = useState(""); const [rDone, setRDone] = useState(false); const [rLink, setRLink] = useState(""); const [rPin, setRPin] = useState(0);

      const addRoom = (e) => {
        e.preventDefault();
        if(rDone && !rLink) return notify("Phòng đã hoàn thành phải nhập link!");
        setDb(p => ({...p, rooms: [...p.rooms, { id: Date.now(), name: rName, image: rImgB64, tags: [], note: "", idea: "", isCompleted: rDone, link: rLink, pinRank: Number(rPin), votes: 0, createdAt: Date.now() }]}));
        notify("Thêm phòng thành công!"); setRName(""); setRImgB64("");
      };

      // CONFIG ẢNH GAME
      const handleGameImgUpload = (key, file) => {
        fileToBase64(file, (b64) => {
          setDb(p => ({...p, settings: {...p.settings, gameImages: {...p.settings.gameImages, [key]: b64}}}));
          notify("Cập nhật ảnh game thành công!");
        });
      };

      return (
        <div className="space-y-6">
          <div className={`p-4 rounded-3xl border ${cardBg} flex gap-2`}>
            <button onClick={()=>setTab('rooms')} className={`px-4 py-2 font-bold rounded-xl text-xs ${tab==='rooms'?'bg-rose-600 text-white':'bg-black/5'}`}>Phòng</button>
            <button onClick={()=>setTab('config')} className={`px-4 py-2 font-bold rounded-xl text-xs ${tab==='config'?'bg-rose-600 text-white':'bg-black/5'}`}>Cấu Hình Ảnh Game</button>
          </div>

          <div className={`p-6 rounded-3xl border ${cardBg}`}>
            {tab === "rooms" && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <form onSubmit={addRoom} className="space-y-3">
                  <h3 className="font-bold">Thêm Phòng (Upload Ảnh File)</h3>
                  <input value={rName} onChange={e=>setRName(e.target.value)} placeholder="Tên phòng" required className="w-full p-2 border rounded bg-transparent text-sm" />
                  <input type="file" accept="image/*" onChange={(e)=>fileToBase64(e.target.files[0], setRImgB64)} required className="w-full p-2 border rounded bg-transparent text-sm" />
                  {rImgB64 && <img src={rImgB64} className="h-20 rounded" />}
                  <div className="flex gap-2">
                    <select value={rPin} onChange={e=>setRPin(e.target.value)} className="w-1/2 p-2 border rounded bg-transparent">
                      <option value={0}>Không ghim</option><option value={1}>Top 1</option>
                    </select>
                    <label className="flex items-center gap-1 font-bold text-xs"><input type="checkbox" checked={rDone} onChange={e=>setRDone(e.target.checked)} />Đã hoàn thành</label>
                  </div>
                  {rDone && <input value={rLink} onChange={e=>setRLink(e.target.value)} placeholder="Link dẫn tới phòng *" required className="w-full p-2 border border-emerald-500 rounded bg-transparent" />}
                  <button type="submit" className="w-full py-2 bg-rose-600 text-white font-bold rounded">Thêm Phòng</button>
                </form>
                <div className="max-h-80 overflow-y-auto space-y-2">
                  {db.rooms.map(r => (
                    <div key={r.id} className="p-3 border rounded flex justify-between">
                      <div>
                        <p className="font-bold text-sm">{r.name}</p>
                        {r.image && <img src={r.image} className="w-12 h-12 object-cover rounded mt-1" />}
                      </div>
                      <button onClick={()=>setDb(p=>({...p, rooms: p.rooms.filter(x=>x.id!==r.id)}))} className="text-rose-600 font-bold text-xs">Xóa</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {tab === "config" && (
              <div className="space-y-4">
                <h3 className="font-bold border-b pb-2">Tải Ảnh Game Từ Máy (File .jpg, .png)</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {["garden", "fishing", "star", "diary", "story", "quiz", "tea"].map(k => (
                    <div key={k} className="flex flex-col gap-2 p-3 border rounded-xl">
                      <span className="font-bold text-xs uppercase">{k}</span>
                      <input type="file" accept="image/*" onChange={(e)=>handleGameImgUpload(k, e.target.files[0])} className="text-xs" />
                      {db.settings.gameImages[k] && <img src={db.settings.gameImages[k]} className="h-16 object-cover rounded shadow" />}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
