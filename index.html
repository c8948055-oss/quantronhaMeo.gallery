<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quán Trọ Nhà Mèo</title>
  
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes float-note {
      0% { transform: translateY(0px) scale(0.8); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-40px) translateX(15px) scale(1.2); opacity: 0; }
    }
    @keyframes falling-leaf {
      0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translate(100px, 100vh) rotate(360deg); opacity: 0; }
    }
    @keyframes firefly-glow {
      0%, 100% { opacity: 0.2; transform: scale(0.8) translateY(0); }
      50% { opacity: 0.9; transform: scale(1.3) translateY(-15px); }
    }
    .animate-spin-slow { animation: spin-slow 8s linear infinite; }
    .animate-float-1 { animation: float-note 2.5s ease-in-out infinite; }
    .animate-float-2 { animation: float-note 3s ease-in-out 1s infinite; }
    .leaf-particle { position: fixed; pointer-events: none; z-index: 1; animation: falling-leaf 12s linear infinite; }
    .firefly-particle { position: fixed; pointer-events: none; z-index: 1; border-radius: 50%; animation: firefly-glow 4s ease-in-out infinite; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 4px; }
  </style>
</head>
<body class="transition-colors duration-500 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- MOCK DATABASE KHỞI TẠO (LOCALSTORAGE) ---
    const INITIAL_DATA = {
      rooms: [
        { id: 1, name: "Phòng Trà Mây Ngủ", image: "https://picsum.photos/seed/room1/600/400", tags: ["Thư giãn", "Trà đạo"], note: "Có ban công ngắm suối", idea: "Thiết kế gỗ mộc và rèm lụa bồng bềnh", isCompleted: false, link: "", votes: 42, pinRank: 1, createdAt: Date.now() - 30000 },
        { id: 2, name: "Gác Mái Đom Đóm", image: "https://picsum.photos/seed/room2/600/400", tags: ["Lãng mạn", "Ban đêm"], note: "Kính thiên văn ngắm sao", idea: "Trần nhà kính nhìn thẳng lên bầu trời đêm", isCompleted: false, link: "", votes: 35, pinRank: 2, createdAt: Date.now() - 20000 },
        { id: 3, name: "Hiên Nhà Nắng Ấm", image: "https://picsum.photos/seed/room3/600/400", tags: ["Sân vườn", "Mèo"], note: "Gần khu vườn thảo mộc", idea: "Có 5 chú mèo lười nằm sưởi nắng", isCompleted: false, link: "", votes: 28, pinRank: 3, createdAt: Date.now() - 10000 },
        { id: 4, name: "Phòng Suối Nhạc", image: "https://picsum.photos/seed/room4/600/400", tags: ["Âm nhạc"], note: "Tiếng nước róc rách", idea: "Được xây dựng ngay bên bờ suối đá", isCompleted: false, link: "", votes: 15, pinRank: 0, createdAt: Date.now() },
        { id: 5, name: "Căn Nhà Gỗ Cũ (Đã Mở)", image: "https://picsum.photos/seed/room5/600/400", tags: ["Hoàn thành"], note: "Đã đi vào hoạt động", idea: "Căn phòng đầu tiên của quán", isCompleted: true, link: "https://google.com", votes: 89, pinRank: 0, createdAt: Date.now() - 100000 }
      ],
      songs: [
        { id: 1, title: "Khúc Hát Ban Mai", artist: "Mèo Du Ca", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
        { id: 2, title: "Gió Qua Thung Lũng", artist: "Quán Trọ Band", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
        { id: 3, title: "Đêm Đom Đóm Lập Lòe", artist: "Thính Phòng Mèo", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
      ],
      user: {
        name: "Vị Khách Đáng Yêu",
        avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=catguest",
        email: "khach@nhameo.vn",
        loc: 150,
        houseName: "Tổ Ấm Của Mèo",
        hasCustomHouseName: false,
        checkInStreak: 3,
        lastCheckIn: null,
        houseItems: ["giuong_go", "tham_co", "chau_hoa"],
        gardenItems: ["hoa_cuc", "ban_tra"],
        fishCollection: ["Cá Bảy Màu", "Cá Chép Vàng"],
        teaRecipes: ["Trà Mưa Rừng"],
        diaryEntries: [
          { id: 1, author: "Mèo Mun", text: "Hôm nay gió mát thật, nằm hiên nhà cả ngày.", isPublic: true, reacts: { leaf: 5, tea: 3, flower: 8, moon: 2 } }
        ],
        storyChapters: [
          { id: 1, author: "Quản Gia", text: "Đêm đó, căn phòng số 07 tự nhiên sáng đèn lấp lánh ánh xanh..." }
        ]
      },
      shopItems: [
        { id: "giuong_nem", name: "Giường Nệm Bông", category: "Nội thất", price: 40, icon: "🛏️" },
        { id: "ke_sach", name: "Kệ Sách Cổ", category: "Nội thất", price: 35, icon: "📚" },
        { id: "ho_nuoc", name: "Hồ Nước Nhỏ", category: "Sân vườn", price: 50, icon: "⛲" },
        { id: "cay_phong", name: "Cây Phong Đỏ", category: "Cây cối", price: 30, icon: "🍁" },
        { id: "meo_cam", name: "Mèo Cam Béo", category: "Thú cưng", price: 80, icon: "🐈" },
        { id: "hieu_ung_sao", name: "Đom Đóm Quanh Nhà", category: "Hiệu ứng", price: 60, icon: "✨" }
      ],
      achievements: [
        { id: 1, title: "Khách Quen", desc: "Ghé Nhà Trọ 7 ngày", reward: 50, icon: "🍃", unlocked: false },
        { id: 2, title: "Người Làm Vườn", desc: "Thu hoạch cây 3 lần", reward: 40, icon: "🌱", unlocked: true },
        { id: 3, title: "Bạn Của Dòng Suối", desc: "Bắt được 5 loài cá", reward: 60, icon: "🎣", unlocked: false }
      ]
    };

    function App() {
      // --- THEME & GLOBAL STATE ---
      const [theme, setTheme] = useState(() => localStorage.getItem("theme") || "light");
      const [db, setDb] = useState(() => {
        const saved = localStorage.getItem("quan_tro_db");
        return saved ? JSON.parse(saved) : INITIAL_DATA;
      });
      const [activeTab, setActiveTab] = useState("rooms"); // 'rooms' | 'house' | 'games' | 'shop' | 'admin'
      const [userAuth, setUserAuth] = useState(() => JSON.parse(localStorage.getItem("user_session")) || null);
      const [isAdmin, setIsAdmin] = useState(false);
      
      // Modals & UI States
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [showMusicDrawer, setShowMusicDrawer] = useState(false);
      const [roomSortBy, setRoomSortBy] = useState("newest"); // 'newest' | 'votes'
      const [notification, setNotification] = useState("");

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem("quan_tro_db", JSON.stringify(db));
      }, [db]);

      useEffect(() => {
        localStorage.setItem("theme", theme);
      }, [theme]);

      const notify = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(""), 3500);
      };

      const addLoc = (amount, reason) => {
        setDb(prev => ({
          ...prev,
          user: { ...prev.user, loc: prev.user.loc + amount }
        }));
        notify(`🍀 +${amount} Lộc (${reason})`);
      };

      // --- AUDIO ENGINE ---
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentSongIndex, setCurrentSongIndex] = useState(0);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const audioRef = useRef(new Audio());

      useEffect(() => {
        if (db.songs.length > 0) {
          const randIdx = Math.floor(Math.random() * db.songs.length);
          setCurrentSongIndex(randIdx);
          audioRef.current.src = db.songs[randIdx].url;
        }
      }, []);

      useEffect(() => {
        const audio = audioRef.current;
        const updateTime = () => setCurrentTime(audio.currentTime);
        const updateDuration = () => setDuration(audio.duration || 0);
        const handleEnded = () => {
          // Play next in sequence
          setCurrentSongIndex(prev => {
            const next = (prev + 1) % db.songs.length;
            audio.src = db.songs[next].url;
            audio.play().catch(() => setIsPlaying(false));
            return next;
          });
        };

        audio.addEventListener("timeupdate", updateTime);
        audio.addEventListener("loadedmetadata", updateDuration);
        audio.addEventListener("ended", handleEnded);

        return () => {
          audio.removeEventListener("timeupdate", updateTime);
          audio.removeEventListener("loadedmetadata", updateDuration);
          audio.removeEventListener("ended", handleEnded);
        };
      }, [db.songs]);

      const togglePlay = () => {
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          audioRef.current.play().then(() => setIsPlaying(true)).catch(() => {
            notify("Nhấp lại đĩa nhạc để trình duyệt phát âm thanh nhé!");
          });
        }
      };

      const playSong = (index) => {
        setCurrentSongIndex(index);
        audioRef.current.src = db.songs[index].url;
        audioRef.current.play().then(() => setIsPlaying(true));
      };

      // --- CHECK-IN ENGINE ---
      const handleCheckIn = () => {
        const today = new Date().toDateString();
        if (db.user.lastCheckIn === today) {
          notify("Hôm nay bạn đã ghé thăm Nhà Trọ rồi, mai quay lại nhé!");
          return;
        }
        const newStreak = (db.user.checkInStreak || 0) + 1;
        let reward = 10;
        if (newStreak % 30 === 0) reward = 100;
        else if (newStreak % 14 === 0) reward = 50;
        else if (newStreak % 7 === 0) reward = 30;
        else if (newStreak % 3 === 0) reward = 20;

        setDb(prev => ({
          ...prev,
          user: {
            ...prev.user,
            loc: prev.user.loc + reward,
            checkInStreak: newStreak,
            lastCheckIn: today
          }
        }));
        notify(`🎉 Ghé trọ ngày ${newStreak}! Nhận +${reward} 🍀 Lộc`);
      };

      // --- RANDOM LOST ITEM MINI-GAME ---
      const [lostItem, setLostItem] = useState(null);
      useEffect(() => {
        const items = ["🍃", "🗝️", "🌸", "🐈", "⭐", "🎵", "🦋"];
        const timer = setInterval(() => {
          if (Math.random() > 0.4) {
            setLostItem({
              icon: items[Math.floor(Math.random() * items.length)],
              top: Math.floor(Math.random() * 80 + 10) + "%",
              left: Math.floor(Math.random() * 80 + 10) + "%"
            });
          }
        }, 15000);
        return () => clearInterval(timer);
      }, []);

      const collectLostItem = () => {
        addLoc(5, "Tìm thấy vật thất lạc!");
        setLostItem(null);
      };

      // --- THEME STYLES ---
      const isDark = theme === "dark";
      const bgClasses = isDark
        ? "bg-slate-950 text-indigo-100"
        : "bg-emerald-50/70 text-slate-800";
      const cardBg = isDark
        ? "bg-slate-900/80 border-slate-800 backdrop-blur-md"
        : "bg-white/85 border-emerald-100/80 backdrop-blur-md shadow-sm";

      return (
        <div className={`min-h-screen relative overflow-x-hidden ${bgClasses}`}>
          {/* Background Atmospheric Particles */}
          {!isDark ? (
            <>
              <div className="leaf-particle" style={{ left: "10%", animationDelay: "0s" }}>🍃</div>
              <div className="leaf-particle" style={{ left: "35%", animationDelay: "4s" }}>🌸</div>
              <div className="leaf-particle" style={{ left: "65%", animationDelay: "2s" }}>🍃</div>
              <div className="leaf-particle" style={{ left: "85%", animationDelay: "7s" }}>🌸</div>
            </>
          ) : (
            <>
              <div className="firefly-particle bg-yellow-300 w-2 h-2" style={{ top: "20%", left: "15%", boxShadow: "0 0 10px #fef08a" }}></div>
              <div className="firefly-particle bg-yellow-300 w-1.5 h-1.5" style={{ top: "60%", left: "45%", animationDelay: "2s", boxShadow: "0 0 8px #fef08a" }}></div>
              <div className="firefly-particle bg-yellow-300 w-2 h-2" style={{ top: "40%", left: "80%", animationDelay: "1s", boxShadow: "0 0 10px #fef08a" }}></div>
              <div className="firefly-particle bg-yellow-300 w-1 h-1" style={{ top: "75%", left: "25%", animationDelay: "3s" }}></div>
            </>
          )}

          {/* Lost Item Floating Game */}
          {lostItem && (
            <button
              onClick={collectLostItem}
              style={{ top: lostItem.top, left: lostItem.left }}
              className="fixed z-40 text-2xl p-2 bg-white/40 dark:bg-slate-800/60 rounded-full shadow-lg hover:scale-125 transition-transform animate-bounce"
              title="Nhặt vật phẩm bí mật!"
            >
              {lostItem.icon}
            </button>
          )}

          {/* Notification Toast */}
          {notification && (
            <div className="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 px-5 py-2.5 bg-emerald-600 dark:bg-indigo-600 text-white rounded-full shadow-xl text-sm font-medium animate-pulse flex items-center gap-2">
              <span>{notification}</span>
            </div>
          )}

          {/* HEADER SECTION */}
          <header className={`border-b sticky top-0 z-30 ${isDark ? "border-slate-800 bg-slate-950/80" : "border-emerald-100 bg-white/80"} backdrop-blur-md`}>
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              {/* Logo & Title */}
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab("rooms")}>
                <div className="w-11 h-11 rounded-full overflow-hidden bg-emerald-100 dark:bg-slate-800 border-2 border-emerald-400 dark:border-indigo-400 flex items-center justify-center shadow-inner">
                  <img
                    src="ChatGPT_Image_21_56_27_31_thg_7__2026-removebg-preview.png"
                    alt="Logo"
                    onError={(e) => { e.target.src = "https://api.dicebear.com/7.x/bottts/svg?seed=MeoLogo"; }}
                    className="w-full h-full object-cover"
                  />
                </div>
                <div>
                  <h1 className="font-bold text-lg tracking-wide text-emerald-800 dark:text-indigo-200">Quán trọ nhà Mèo</h1>
                  <p className="text-xs text-emerald-600/80 dark:text-indigo-400/80">Nơi dừng chân thảnh thơi</p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="hidden md:flex items-center gap-1">
                {[
                  { id: "rooms", label: "Phòng Sắp Ra Mắt", icon: "🚪" },
                  { id: "house", label: "Nhà & Sân Vườn", icon: "🏡" },
                  { id: "games", label: "Góc Thư Giãn (8 Games)", icon: "🎮" },
                  { id: "shop", label: "Cửa Hàng", icon: "🛍️" },
                  ...(isAdmin ? [{ id: "admin", label: "Trang Quản Trị", icon: "⚙️" }] : [])
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-semibold transition-all flex items-center gap-1.5 ${
                      activeTab === tab.id
                        ? (isDark ? "bg-indigo-600 text-white shadow-md shadow-indigo-600/30" : "bg-emerald-600 text-white shadow-md shadow-emerald-600/30")
                        : "hover:bg-black/5 dark:hover:bg-white/5 opacity-80"
                    }`}
                  >
                    <span>{tab.icon}</span>
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>

              {/* Right Controls: Loc + Theme + Auth */}
              <div className="flex items-center gap-2.5">
                {/* Lộc Pill */}
                <div className={`flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold border ${
                  isDark ? "bg-slate-900 border-indigo-900/60 text-yellow-300" : "bg-emerald-100/70 border-emerald-200 text-emerald-800"
                }`}>
                  <span>🍀</span>
                  <span>{db.user.loc}</span>
                </div>

                {/* Theme Toggle */}
                <button
                  onClick={() => setTheme(isDark ? "light" : "dark")}
                  className="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-sm transition-colors"
                  title="Chuyển chế độ ngày/đêm"
                >
                  {isDark ? "🌙 Đêm" : "☀️ Ngày"}
                </button>

                {/* Check-In Button */}
                <button
                  onClick={handleCheckIn}
                  className={`hidden sm:flex items-center gap-1 px-3 py-1 rounded-full text-xs font-semibold shadow transition-transform active:scale-95 ${
                    isDark ? "bg-amber-600 hover:bg-amber-500 text-white" : "bg-amber-500 hover:bg-amber-400 text-white"
                  }`}
                >
                  <span>🍀 Ghé Trọ</span>
                </button>

                {/* Admin or Login */}
                {!isAdmin ? (
                  <button
                    onClick={() => setShowAdminModal(true)}
                    className="text-xs px-2.5 py-1 rounded-lg border border-slate-300 dark:border-slate-700 hover:border-emerald-500 font-medium"
                  >
                    Admin
                  </button>
                ) : (
                  <button
                    onClick={() => { setIsAdmin(false); notify("Đã thoát chế độ Admin"); }}
                    className="text-xs px-2.5 py-1 rounded-lg bg-rose-500/20 text-rose-400 font-medium border border-rose-500/30"
                  >
                    Đăng xuất Admin
                  </button>
                )}
              </div>
            </div>

            {/* Mobile Nav */}
            <div className="flex md:hidden overflow-x-auto px-4 py-2 gap-2 border-t border-black/5 dark:border-white/5 text-xs">
              <button onClick={() => setActiveTab("rooms")} className={`px-2.5 py-1 rounded-full whitespace-nowrap ${activeTab === 'rooms' ? 'font-bold underline' : ''}`}>🚪 Phòng</button>
              <button onClick={() => setActiveTab("house")} className={`px-2.5 py-1 rounded-full whitespace-nowrap ${activeTab === 'house' ? 'font-bold underline' : ''}`}>🏡 Nhà Riêng</button>
              <button onClick={() => setActiveTab("games")} className={`px-2.5 py-1 rounded-full whitespace-nowrap ${activeTab === 'games' ? 'font-bold underline' : ''}`}>🎮 Games (8)</button>
              <button onClick={() => setActiveTab("shop")} className={`px-2.5 py-1 rounded-full whitespace-nowrap ${activeTab === 'shop' ? 'font-bold underline' : ''}`}>🛍️ Cửa Hàng</button>
              {isAdmin && <button onClick={() => setActiveTab("admin")} className={`px-2.5 py-1 rounded-full whitespace-nowrap ${activeTab === 'admin' ? 'font-bold underline' : ''}`}>⚙️ Quản Trị</button>}
            </div>
          </header>

          {/* MAIN VIEW CONTROLLER */}
          <main className="max-w-6xl mx-auto px-4 py-8 relative z-10 pb-28">
            {activeTab === "rooms" && <RoomsView db={db} setDb={setDb} notify={notify} cardBg={cardBg} isDark={isDark} />}
            {activeTab === "house" && <HouseView db={db} setDb={setDb} notify={notify} cardBg={cardBg} isDark={isDark} addLoc={addLoc} />}
            {activeTab === "games" && <MiniGamesView db={db} setDb={setDb} notify={notify} cardBg={cardBg} isDark={isDark} addLoc={addLoc} />}
            {activeTab === "shop" && <ShopView db={db} setDb={setDb} notify={notify} cardBg={cardBg} isDark={isDark} />}
            {activeTab === "admin" && isAdmin && <AdminView db={db} setDb={setDb} notify={notify} cardBg={cardBg} isDark={isDark} />}
          </main>

          {/* FLOATING VINYL MUSIC PLAYER (BOTTOM-RIGHT) */}
          <div className="fixed bottom-6 right-6 z-40 flex flex-col items-end">
            {/* Music Notes Animation */}
            {isPlaying && (
              <div className="relative w-12 h-6 pointer-events-none mb-1 text-emerald-500 dark:text-indigo-400 font-bold">
                <span className="absolute left-2 animate-float-1">🎵</span>
                <span className="absolute right-2 animate-float-2">🎶</span>
              </div>
            )}

            <div className="flex items-center gap-2">
              {/* Expand Playlist Button */}
              <button
                onClick={() => setShowMusicDrawer(!showMusicDrawer)}
                className={`p-2.5 rounded-full shadow-lg transition-transform active:scale-95 ${
                  isDark ? "bg-slate-800 border border-slate-700 text-indigo-200" : "bg-white border border-emerald-200 text-emerald-800"
                }`}
                title="Giai Điệu Quán Trọ"
              >
                📜
              </button>

              {/* Vinyl Disc Button */}
              <div
                onClick={togglePlay}
                className={`w-14 h-14 rounded-full border-4 cursor-pointer shadow-xl flex items-center justify-center relative transition-transform hover:scale-105 ${
                  isDark ? "border-slate-800 bg-slate-900" : "border-emerald-100 bg-slate-900"
                } ${isPlaying ? "animate-spin-slow" : ""}`}
                title={isPlaying ? "Dừng nhạc" : "Phát nhạc"}
              >
                {/* Vinyl Texture */}
                <div className="w-10 h-10 rounded-full border border-slate-700 flex items-center justify-center">
                  <div className="w-5 h-5 rounded-full bg-amber-600 flex items-center justify-center text-[9px] text-white font-bold">
                    {isPlaying ? "⏸" : "▶"}
                  </div>
                </div>
              </div>
            </div>

            {/* Music Drawer Popup */}
            {showMusicDrawer && (
              <div className={`mt-3 w-80 p-4 rounded-2xl shadow-2xl border ${cardBg} animate-in fade-in slide-in-from-bottom-5`}>
                <div className="flex justify-between items-center mb-3">
                  <h4 className="font-bold text-sm flex items-center gap-1.5">
                    <span>📻</span>
                    <span>Giai Điệu Quán Trọ</span>
                  </h4>
                  <button onClick={() => setShowMusicDrawer(false)} className="text-xs opacity-60 hover:opacity-100">✕</button>
                </div>

                {/* Current Song Playing */}
                <div className="mb-3 p-2.5 rounded-xl bg-black/5 dark:bg-white/5 text-xs">

    function RoomsView({ db, setDb, notify, cardBg, isDark }) {
      const [sortBy, setSortBy] = useState("newest");

      const handleVote = (roomId) => {
        setDb(prev => ({
          ...prev,
          rooms: prev.rooms.map(r => r.id === roomId ? { ...r, votes: r.votes + 1 } : r)
        }));
        notify("Đã Chấm hóng thành công! 💖");
      };

      // Tách phòng: Ghim top 1 2 3, phòng thường chưa xong, và phòng đã hoàn thành (bị ép xuống cuối)
      const pinnedRooms = useMemo(() => {
        return db.rooms.filter(r => r.pinRank > 0 && !r.isCompleted).sort((a, b) => a.pinRank - b.pinRank);
      }, [db.rooms]);

      const otherRooms = useMemo(() => {
        const uncompleted = db.rooms.filter(r => r.pinRank === 0 && !r.isCompleted);
        if (sortBy === "votes") {
          uncompleted.sort((a, b) => b.votes - a.votes);
        } else {
          uncompleted.sort((a, b) => b.createdAt - a.createdAt);
        }
        const completed = db.rooms.filter(r => r.isCompleted).sort((a, b) => b.votes - a.votes);
        return [...uncompleted, ...completed];
      }, [db.rooms, sortBy]);

      return (
        <div className="space-y-10">
          {/* Hero Banner */}
          <div className={`p-8 rounded-3xl border ${cardBg} text-center space-y-3 relative overflow-hidden`}>
            <span className="text-3xl">🌸 🍃 🏡</span>
            <h2 className="text-2xl sm:text-3xl font-extrabold tracking-tight">Các Căn Phòng Sắp Ra Mắt</h2>
            <p className="text-xs sm:text-sm max-w-xl mx-auto opacity-75">
              Khám phá và "Chấm hóng" những không gian nghỉ dưỡng mới nhất đang được hoàn thiện tại Quán trọ nhà Mèo.
            </p>
          </div>

          {/* BẢNG GHIM TOP 3 PHÒNG SẮP RA MẮT */}
          {pinnedRooms.length > 0 && (
            <div className="space-y-4">
              <div className="flex items-center gap-2">
                <span className="text-xl">📌</span>
                <h3 className="font-bold text-lg tracking-wide">Top 3 Phòng Ra Mắt Sớm Nhất (Trong Tháng Tới)</h3>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {pinnedRooms.map(room => (
                  <RoomCard key={room.id} room={room} onVote={() => handleVote(room.id)} isPinned rank={room.pinRank} cardBg={cardBg} isDark={isDark} />
                ))}
              </div>
            </div>
          )}

          {/* DANH SÁCH CÁC PHÒNG KHÁC */}
          <div className="space-y-4 pt-4 border-t border-black/5 dark:border-white/5">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
              <h3 className="font-bold text-lg tracking-wide flex items-center gap-2">
                <span>🚪</span>
                <span>Tất Cả Các Phòng Nghỉ Khác</span>
              </h3>
              {/* Sort Filter Buttons */}
              <div className="flex items-center gap-1.5 p-1 bg-black/5 dark:bg-white/5 rounded-xl text-xs font-semibold">
                <button
                  onClick={() => setSortBy("newest")}
                  className={`px-3 py-1 rounded-lg transition-all ${sortBy === "newest" ? "bg-white dark:bg-slate-800 shadow-sm" : "opacity-60"}`}
                >
                  ✨ Mới nhất
                </button>
                <button
                  onClick={() => setSortBy("votes")}
                  className={`px-3 py-1 rounded-lg transition-all ${sortBy === "votes" ? "bg-white dark:bg-slate-800 shadow-sm" : "opacity-60"}`}
                >
                  🔥 Nhiều vote nhất
                </button>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {otherRooms.map(room => (
                <RoomCard key={room.id} room={room} onVote={() => handleVote(room.id)} cardBg={cardBg} isDark={isDark} />
              ))}
            </div>
          </div>
        </div>
      );
    }

            </div>
          </div>
        </div>
      );
    }

            {currentGame === 1 && <GardenGame addLoc={addLoc} notify={notify} />}
            {currentGame === 2 && <FishingGame addLoc={addLoc} notify={notify} db={db} setDb={setDb} />}
            {currentGame === 3 && <StarGardenGame addLoc={addLoc} notify={notify} isDark={isDark} />}
            {currentGame === 4 && <DiaryGame db={db} setDb={setDb} addLoc={addLoc} notify={notify} />}
            {currentGame === 5 && <StoryGame db={db} setDb={setDb} addLoc={addLoc} notify={notify} />}
            {currentGame === 6 && <QuizGame addLoc={addLoc} notify={notify} />}
            {currentGame === 7 && <TeaGame db={db} setDb={setDb} addLoc={addLoc} notify={notify} />}
          </div>
        </div>
      );
    }

    // GAME 1: CHĂM VƯỜN
    function GardenGame({ addLoc, notify }) {
      const [waterCount, setWaterCount] = useState(0);
      const neededWaters = 4;

      const stages = [
        { icon: "🌰", name: "Hạt giống vừa gieo" },
        { icon: "🌱", name: "Mầm non hé nụ" },
        { icon: "🌿", name: "Cây lá sum suê" },
        { icon: "🌸", name: "Cây Trà Nở Hoa Rực Rỡ" }
      ];

      const currentStage = Math.min(waterCount, stages.length - 1);

      const waterPlant = () => {
        if (waterCount + 1 >= neededWaters) {
          addLoc(25, "Thu hoạch Cây Trà Hoa!");
          setWaterCount(0);
        } else {
          setWaterCount(prev => prev + 1);
          notify("Tưới nước mát lành cho mầm non 🌱");
        }
      };

      return (
        <div className="text-center space-y-4 max-w-md mx-auto py-4">
          <h3 className="font-bold text-lg">🌱 Khu Vườn Thảo Mộc</h3>
          <p className="text-xs opacity-75">Tưới đủ {neededWaters} lần nước để cây đơm hoa và nhận Lộc!</p>
          <div className="h-40 flex flex-col items-center justify-center">
            <span className="text-7xl transition-all duration-300 transform scale-110">{stages[currentStage].icon}</span>
            <p className="font-semibold text-xs mt-3">{stages[currentStage].name}</p>
          </div>
          <button
            onClick={waterPlant}
            className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-2xl shadow-lg transition-transform active:scale-95"
          >
            {waterCount + 1 >= neededWaters ? "✨ Thu Hoạch (+25 🍀)" : `💧 Tưới Nước (${waterCount}/${neededWaters})`}
          </button>
        </div>
      );
    }

    // GAME 2: CÂU CÁ
    function FishingGame({ addLoc, notify, db, setDb }) {
      const [status, setStatus] = useState("idle"); // 'idle' | 'waiting' | 'bite'
      const [caughtFish, setCaughtFish] = useState(null);

      const castRod = () => {
        setStatus("waiting");
        setCaughtFish(null);
        const waitTime = Math.random() * 3000 + 2000;
        setTimeout(() => {
          setStatus("bite");
        }, waitTime);
      };

      const pullRod = () => {
        if (status === "bite") {
          const fishList = [
            { name: "Cá Bảy Màu Thường", rarity: "Thường", reward: 8, icon: "🐟" },
            { name: "Cá Chép Vàng Quý", rarity: "Hiếm", reward: 15, icon: "🐠" },
            { name: "Cá Thần Suối Băng", rarity: "Huyền Thoại", reward: 40, icon: "✨" }
          ];
          const rand = Math.random();
          const fish = rand > 0.85 ? fishList[2] : (rand > 0.5 ? fishList[1] : fishList[0]);
          setCaughtFish(fish);
          setStatus("idle");
          addLoc(fish.reward, `Câu được ${fish.name}`);

          if (!db.user.fishCollection.includes(fish.name)) {
            setDb(prev => ({
              ...prev,
              user: { ...prev.user, fishCollection: [...prev.user.fishCollection, fish.name] }
            }));
          }
        } else {
          notify("Cá chưa cắn câu mà bạn giật sớm quá rồi!");
          setStatus("idle");
        }
      };

      return (
        <div className="text-center space-y-4 max-w-md mx-auto py-4">
          <h3 className="font-bold text-lg">🎣 Câu Cá Bên Suối Đá</h3>
          <p className="text-xs opacity-75">Thả câu và chú ý giật cần ngay khi có tín hiệu "CÁ CẮN CÂU!"</p>
          <div className="h-36 flex flex-col items-center justify-center">
            {status === "idle" && <span className="text-6xl">🌊</span>}
            {status === "waiting" && <span className="text-5xl animate-bounce">🎣 ...đang chờ cá...</span>}
            {status === "bite" && <span className="text-6xl animate-ping font-extrabold text-rose-500">❗ CẮN CÂU RỒI ❗</span>}
          </div>
          {status === "idle" && (
            <button onClick={castRod} className="px-6 py-2.5 bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold rounded-2xl shadow">
              Thả Cần Câu 🎣
            </button>
          )}
          {status === "waiting" && (
            <button onClick={() => setStatus("idle")} className="px-6 py-2.5 bg-slate-500 text-white text-xs font-bold rounded-2xl shadow">
              Thu Cần Lại
            </button>
          )}
          {status === "bite" && (
            <button onClick={pullRod} className="px-8 py-3 bg-rose-600 hover:bg-rose-500 text-white text-sm font-extrabold rounded-2xl shadow-xl animate-pulse">
              GIẬT CẦN NGAY! 🎣
            </button>
          )}
          {caughtFish && (
            <div className="p-3 bg-emerald-500/20 rounded-xl text-xs font-semibold">
              🎉 Bạn đã câu được: {caughtFish.icon} <strong>{caughtFish.name}</strong> ({caughtFish.rarity})!
            </div>
          )}
        </div>
      );
    }

    // GAME 3: VƯỜN SAO
    function StarGardenGame({ addLoc, notify, isDark }) {
      const [stars, setStars] = useState([]);
      const [name, setName] = useState("");

      const addStar = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        setStars(prev => [...prev, { x, y }]);
      };

      const saveConstellation = () => {
        if (stars.length < 3) {
          notify("Cần ít nhất 3 ngôi sao để tạo thành một chòm sao!");
          return;
        }
        addLoc(20, `Tạo chòm sao "${name || "Chòm Mèo Lười"}"`);
        setStars([]);
        setName("");
      };

      return (
        <div className="space-y-4 max-w-lg mx-auto py-2">
          <div className="text-center">
            <h3 className="font-bold text-lg">🌙 Vườn Sao & Chòm Sao</h3>
            <p className="text-xs opacity-75">Nhấp chuột vào bầu trời đêm để đặt và nối các ngôi sao</p>
          </div>
          <div
            onClick={addStar}
            className="h-60 bg-slate-950 rounded-2xl relative cursor-crosshair overflow-hidden border border-slate-800 shadow-inner"
          >
            {stars.map((s, idx) => (
              <div key={idx} style={{ left: s.x - 6, top: s.y - 6 }} className="absolute text-yellow-300 text-xs animate-ping">
                ⭐
              </div>
            ))}
            {stars.length === 0 && (
              <span className="absolute inset-0 flex items-center justify-center text-xs text-slate-500 pointer-events-none">
                Nhấp vào đây để đặt ngôi sao đầu tiên...
              </span>
            )}
          </div>
          <div className="flex gap-2">
            <input
              value={name}
              onChange={(e) => setName(e.target.value)}
              placeholder="Đặt tên chòm sao (VD: Chòm Mèo Ngủ...)"
              className="flex-1 px-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent"
            />
            <button onClick={saveConstellation} className="px-4 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow">
              Lưu Chòm Sao ✨
            </button>
          </div>
        </div>
      );
    }

    // GAME 4: NHẬT KÝ
    function DiaryGame({ db, setDb, addLoc, notify }) {
      const [input, setInput] = useState("");
      const [isPublic, setIsPublic] = useState(true);

      const submitDiary = (e) => {
        e.preventDefault();
        if (!input.trim()) return;
        const newEntry = {
          id: Date.now(),
          author: db.user.name,
          text: input.trim(),
          isPublic,
          reacts: { leaf: 1, tea: 1, flower: 1, moon: 1 }
        };
        setDb(prev => ({
          ...prev,
          user: {
            ...prev.user,
            diaryEntries: [newEntry, ...prev.user.diaryEntries]
          }
        }));
        addLoc(15, "Viết dòng nhật ký hôm nay");
        setInput("");
      };

      return (
        <div className="max-w-xl mx-auto space-y-5 py-2">
          <div className="text-center">
            <h3 className="font-bold text-lg">📖 Nhật Ký Nhà Trọ</h3>
            <p className="text-xs opacity-75">Hôm nay điều gì đã khiến bạn cảm thấy bình yên mỉm cười?</p>
          </div>
          <form onSubmit={submitDiary} className="space-y-3">
            <textarea
              value={input}
              onChange={(e) => setInput(e.target.value)}
              placeholder="Gửi gắm vài dòng tâm sự..."
              className="w-full h-24 p-3 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent focus:outline-none focus:ring-2 focus:ring-emerald-500"
            />
            <div className="flex justify-between items-center">
              <label className="text-xs flex items-center gap-1.5 cursor-pointer">
                <input type="checkbox" checked={isPublic} onChange={(e) => setIsPublic(e.target.checked)} />
                <span>Chia sẻ công khai với Quán Trọ</span>
              </label>
              <button type="submit" className="px-5 py-1.5 bg-emerald-600 dark:bg-indigo-600 text-white text-xs font-bold rounded-xl shadow">
                Lưu Dòng Ký Ức 🍃
              </button>
            </div>
          </form>

          {/* Public Entries */}
          <div className="space-y-3 pt-3 border-t border-black/5 dark:border-white/5 max-h-56 overflow-y-auto">
            {db.user.diaryEntries.map(entry => (
              <div key={entry.id} className="p-3 rounded-xl bg-black/5 dark:bg-white/5 text-xs space-y-1.5">
                <div className="flex justify-between font-bold opacity-80 text-[11px]">
                  <span>{entry.author}</span>
                  <span>{entry.isPublic ? "Công khai 🌍" : "Riêng tư 🔒"}</span>
                </div>
                <p>{entry.text}</p>
                {entry.isPublic && (
                  <div className="flex gap-3 text-[11px] pt-1">
                    <button onClick={() => notify("Đã gửi đồng cảm 🍃")} className="hover:scale-110">🍃 {entry.reacts?.leaf || 0}</button>
                    <button onClick={() => notify("Đã gửi ly trà ☕")} className="hover:scale-110">☕ {entry.reacts?.tea || 0}</button>
                    <button onClick={() => notify("Đã gửi nhành hoa 🌸")} className="hover:scale-110">🌸 {entry.reacts?.flower || 0}</button>
                    <button onClick={() => notify("Đã chạm lòng 🌙")} className="hover:scale-110">🌙 {entry.reacts?.moon || 0}</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // GAME 5: MỘT CÂU CHUYỆN
    function StoryGame({ db, setDb, addLoc, notify }) {
      const [storyInput, setStoryInput] = useState("");

      const handleAddLine = (e) => {
        e.preventDefault();
        if (!storyInput.trim()) return;
        const newChap = { id: Date.now(), author: db.user.name, text: storyInput.trim() };
        setDb(prev => ({
          ...prev,
          user: { ...prev.user, storyChapters: [...prev.user.storyChapters, newChap] }
        }));
        addLoc(10, "Viết tiếp câu chuyện");
        setStoryInput("");
      };

      return (
        <div className="max-w-xl mx-auto space-y-4 py-2">
          <div className="text-center">
            <h3 className="font-bold text-lg">📜 Câu Chuyện Nối Tiếp</h3>
            <p className="text-xs opacity-75">Cùng nhau viết nên những mẩu chuyện kỳ diệu tại Quán Trọ</p>
          </div>
          <div className="h-44 p-4 rounded-xl bg-black/5 dark:bg-white/5 overflow-y-auto space-y-2 text-xs leading-relaxed">
            {db.user.storyChapters.map(c => (
              <p key={c.id}>
                <strong className="text-emerald-700 dark:text-indigo-400">[{c.author}]:</strong> {c.text}
              </p>
            ))}
          </div>
          <form onSubmit={handleAddLine} className="flex gap-2">
            <input
              value={storyInput}
              onChange={(e) => setStoryInput(e.target.value)}
              placeholder="Viết tiếp một câu cho câu chuyện..."
              className="flex-1 px-3 py-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent"
            />
            <button type="submit" className="px-4 py-2 bg-emerald-600 dark:bg-indigo-600 text-white text-xs font-bold rounded-xl shadow">
              Viết Tiếp ✍️
            </button>
          </form>
        </div>
      );
    }

    // GAME 6: CÂU ĐỐ NHỎ
    function QuizGame({ addLoc, notify }) {
      const [answered, setAnswered] = useState(false);

      const handleAnswer = (isCorrect) => {
        if (answered) return;
        setAnswered(true);
        if (isCorrect) {
          addLoc(20, "Giải đúng câu đố!");
        } else {
          notify("Chưa đúng rồi, hẹn bạn câu sau nhé!");
        }
      };

      return (
        <div className="text-center max-w-md mx-auto space-y-4 py-4">
          <h3 className="font-bold text-lg">🧩 Câu Đố Vui Quán Trọ</h3>
          <p className="text-xs font-medium">"Loài hoa nào thường nở rộ báo hiệu mùa xuân về bên hiên nhà gỗ?"</p>
          <div className="grid grid-cols-2 gap-3 pt-2">
            {["Hoa Cúc Họa Mi", "Hoa Mai Vàng & Đào", "Hoa Hướng Dương", "Hoa Bồ Công Anh"].map((opt, idx) => (
              <button
                key={idx}
                disabled={answered}
                onClick={() => handleAnswer(idx === 1)}
                className="p-3 text-xs font-semibold rounded-xl border border-black/10 dark:border-white/10 hover:bg-black/5 dark:hover:bg-white/5 active:scale-95 transition-all"
              >
                {opt}
              </button>
            ))}
          </div>
          {answered && <p className="text-xs text-emerald-600 font-bold">Đáp án chính xác: Hoa Mai Vàng & Đào! ✨</p>}
        </div>
      );
    }

    // GAME 7: PHA TRÀ
    function TeaGame({ db, setDb, addLoc, notify }) {
      const [selectedIngredients, setSelectedIngredients] = useState([]);

      const ingredients = ["Trà Xanh 🍃", "Hoa Cúc 🌼", "Mật Ong 🍯", "Chanh 🍋", "Bạc Hà 🌿"];

      const toggleIng = (ing) => {
        setSelectedIngredients(prev =>
          prev.includes(ing) ? prev.filter(i => i !== ing) : [...prev, ing]
        );
      };

      const brewTea = () => {
        if (selectedIngredients.length < 2) {
          notify("Cần ít nhất 2 nguyên liệu để pha ấm trà ngon!");
          return;
        }
        const teaName = "Trà " + selectedIngredients.map(i => i.split(" ")[0]).join(" ");
        addLoc(20, `Pha thành công ${teaName}`);
        setSelectedIngredients([]);
      };

      return (
        <div className="text-center max-w-md mx-auto space-y-4 py-4">
          <h3 className="font-bold text-lg">🍵 Góc Pha Trà Chiều</h3>
          <p className="text-xs opacity-75">Chọn các nguyên liệu để sáng tạo nên hương vị trà mới</p>
          <div className="flex flex-wrap justify-center gap-2">
            {ingredients.map((ing, idx) => (
              <button
                key={idx}
                onClick={() => toggleIng(ing)}
                className={`px-3.5 py-2 rounded-xl text-xs font-bold border transition-all ${
                  selectedIngredients.includes(ing)
                    ? "bg-amber-600 text-white border-amber-600 shadow"
                    : "border-slate-300 dark:border-slate-700"
                }`}
              >
                {ing}
              </button>
            ))}
          </div>
          <button
            onClick={brewTea}
            className="px-6 py-2.5 bg-amber-700 hover:bg-amber-600 text-white text-xs font-bold rounded-2xl shadow-lg"
          >
            Ủ Trà Ngay 🍵 (+20 🍀)
          </button>
        </div>
      );
    }

    // ==========================================
    // MODULE 4: SHOP & ACHIEVEMENTS VIEW
    // ==========================================
    function ShopView({ db, setDb, notify, cardBg, isDark }) {
      const [category, setCategory] = useState("Tất cả");

      const categories = ["Tất cả", "Nội thất", "Sân vườn", "Cây cối", "Thú cưng", "Hiệu ứng"];

      const buyItem = (item) => {
        if (db.user.loc < item.price) {
          notify("Bạn không đủ Lộc để mua vật phẩm này!");
          return;
        }
        setDb(prev => ({
          ...prev,
          user: {
            ...prev.user,
            loc: prev.user.loc - item.price,
            houseItems: [...prev.user.houseItems, item.id]
          }
        }));
        notify(`Mua thành công ${item.name}! Đã chuyển về nhà riêng 🏡`);
      };

      const filteredItems = category === "Tất cả"
        ? db.shopItems
        : db.shopItems.filter(i => i.category === category);

      return (
        <div className="space-y-8">
          {/* Shop Header */}
          <div className={`p-6 rounded-3xl border ${cardBg} flex justify-between items-center`}>
            <div>
              <h2 className="text-xl font-black flex items-center gap-2">
                <span>🛍️</span>
                <span>Cửa Hàng Nhà Trọ</span>
              </h2>
              <p className="text-xs opacity-75">Sưu tầm các món đồ decor xinh xắn cho căn nhà của bạn</p>
            </div>
            <div className="px-4 py-2 bg-emerald-500/20 text-emerald-800 dark:text-emerald-300 rounded-2xl text-xs font-black">
              Số dư: 🍀 {db.user.loc} Lộc
            </div>
          </div>

          {/* Categories */}
          <div className="flex gap-2 overflow-x-auto pb-1">
            {categories.map(cat => (
              <button
                key={cat}
                onClick={() => setCategory(cat)}
                className={`px-4 py-1.5 rounded-xl text-xs font-bold transition-all ${
                  category === cat
                    ? (isDark ? "bg-indigo-600 text-white" : "bg-emerald-600 text-white")
                    : "bg-black/5 dark:bg-white/5 opacity-75"
                }`}
              >
                {cat}
              </button>
            ))}
          </div>

          {/* Item Grid */}
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            {filteredItems.map(item => (
              <div key={item.id} className={`p-4 rounded-2xl border ${cardBg} flex flex-col justify-between items-center text-center space-y-3`}>
                <span className="text-4xl">{item.icon}</span>
                <div>
                  <h4 className="font-bold text-xs line-clamp-1">{item.name}</h4>
                  <span className="text-[10px] opacity-60">Loại: {item.category}</span>
                </div>
                <button
                  onClick={() => buyItem(item)}
                  className="w-full py-1.5 bg-amber-500 hover:bg-amber-400 text-white text-xs font-bold rounded-xl shadow active:scale-95 transition-transform flex items-center justify-center gap-1"
                >
                  <span>🍀 {item.price} Lộc</span>
                </button>
              </div>
            ))}
          </div>

          {/* BẢNG THÀNH TỰU */}
          <div className="space-y-4 pt-4 border-t border-black/5 dark:border-white/5">
            <h3 className="font-bold text-base flex items-center gap-2">
              <span>🏆</span>
              <span>Bảng Thành Tựu Khách Quen</span>
            </h3>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              {db.achievements.map(ach => (
                <div key={ach.id} className={`p-4 rounded-2xl border ${cardBg} flex items-center gap-3`}>
                  <span className="text-3xl">{ach.icon}</span>
                  <div className="flex-1">
                    <h4 className="font-bold text-xs">{ach.title}</h4>
                    <p className="text-[10px] opacity-70">{ach.desc}</p>
                    <span className="text-[10px] font-bold text-emerald-600 dark:text-indigo-400 mt-1 block">
                      Thưởng: +{ach.reward} 🍀
                    </span>
                  </div>
                  <span className="text-xs">{ach.unlocked ? "✅" : "🔒"}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // MODULE 5: ADMIN MANAGEMENT DASHBOARD
    // ==========================================
    function AdminView({ db, setDb, notify, cardBg, isDark }) {
      const [activeAdminTab, setActiveAdminTab] = useState("rooms");

      // Room Form State
      const [roomName, setRoomName] = useState("");
      const [roomImage, setRoomImage] = useState("");
      const [roomTags, setRoomTags] = useState("");
      const [roomNote, setRoomNote] = useState("");
      const [roomIdea, setRoomIdea] = useState("");
      const [roomPin, setRoomPin] = useState(0);
      const [roomCompleted, setRoomCompleted] = useState(false);
      const [roomLink, setRoomLink] = useState("");

      // Music Form State
      const [songTitle, setSongTitle] = useState("");
      const [songArtist, setSongArtist] = useState("");
      const [songUrl, setSongUrl] = useState("");

      const handleAddRoom = (e) => {
        e.preventDefault();
        if (!roomName.trim()) return;
        const newRoom = {
          id: Date.now(),
          name: roomName,
          image: roomImage || "https://picsum.photos/seed/" + Date.now() + "/600/400",
          tags: roomTags.split(",").map(t => t.trim()).filter(Boolean),
          note: roomNote,
          idea: roomIdea,
          pinRank: Number(roomPin),
          isCompleted: roomCompleted,
          link: roomLink,
          votes: 0,
          createdAt: Date.now()
        };
        setDb(prev => ({ ...prev, rooms: [newRoom, ...prev.rooms] }));
        notify("Thêm phòng mới thành công!");
        setRoomName(""); setRoomImage(""); setRoomTags(""); setRoomNote(""); setRoomIdea(""); setRoomLink("");
      };

      const handleDeleteRoom = (id) => {
        setDb(prev => ({ ...prev, rooms: prev.rooms.filter(r => r.id !== id) }));
        notify("Đã xóa phòng!");
      };

      const handleAddSong = (e) => {
        e.preventDefault();
        if (!songTitle || !songUrl) return;
        const newSong = { id: Date.now(), title: songTitle, artist: songArtist || "Admin", url: songUrl };
        setDb(prev => ({ ...prev, songs: [...prev.songs, newSong] }));
        notify("Đã tải bài hát mới lên hệ thống!");
        setSongTitle(""); setSongArtist(""); setSongUrl("");
      };

      const handleDeleteSong = (id) => {
        setDb(prev => ({ ...prev, songs: prev.songs.filter(s => s.id !== id) }));
        notify("Đã gỡ bài hát!");
      };

      return (
        <div className="space-y-6">
          <div className={`p-6 rounded-3xl border ${cardBg} flex justify-between items-center`}>
            <div>
              <h2 className="text-xl font-black">⚙️ Quản Trị Hệ Thống (Admin Panel)</h2>
              <p className="text-xs opacity-75">Toàn quyền thêm, sửa, xóa phòng, bài hát và quản lý Lộc</p>
            </div>
            <div className="flex gap-2">
              <button
                onClick={() => setActiveAdminTab("rooms")}
                className={`px-3 py-1.5 text-xs font-bold rounded-xl ${activeAdminTab === 'rooms' ? 'bg-emerald-600 text-white' : 'bg-black/5 dark:bg-white/5'}`}
              >
                Quản lý Phòng
              </button>
              <button
                onClick={() => setActiveAdminTab("music")}
                className={`px-3 py-1.5 text-xs font-bold rounded-xl ${activeAdminTab === 'music' ? 'bg-emerald-600 text-white' : 'bg-black/5 dark:bg-white/5'}`}
              >
                Quản lý Nhạc
              </button>
            </div>
          </div>

          {activeAdminTab === "rooms" ? (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              {/* Form Add Room */}
              <form onSubmit={handleAddRoom} className={`p-6 rounded-3xl border ${cardBg} space-y-3`}>
                <h3 className="font-bold text-sm">Thêm Phòng Nghỉ Mới</h3>
                <input value={roomName} onChange={(e) => setRoomName(e.target.value)} placeholder="Tên phòng *" required className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />
                <input value={roomImage} onChange={(e) => setRoomImage(e.target.value)} placeholder="Link ảnh phòng (URL)" className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />
                <input value={roomTags} onChange={(e) => setRoomTags(e.target.value)} placeholder="Tags (cách nhau bằng dấu phẩy)" className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />
                <input value={roomNote} onChange={(e) => setRoomNote(e.target.value)} placeholder="Ghi chú phòng" className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />
                <textarea value={roomIdea} onChange={(e) => setRoomIdea(e.target.value)} placeholder="Ý tưởng thiết kế" className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent h-16" />
                
                <div className="flex gap-2">
                  <select value={roomPin} onChange={(e) => setRoomPin(e.target.value)} className="w-1/2 p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent">
                    <option value={0}>Không ghim</option>
                    <option value={1}>Ghim Top 1</option>
                    <option value={2}>Ghim Top 2</option>
                    <option value={3}>Ghim Top 3</option>
                  </select>
                  <label className="w-1/2 flex items-center text-xs gap-1 cursor-pointer">
                    <input type="checkbox" checked={roomCompleted} onChange={(e) => setRoomCompleted(e.target.checked)} />
                    <span>Đã hoàn thành</span>
                  </label>
                </div>

                {roomCompleted && (
                  <input value={roomLink} onChange={(e) => setRoomLink(e.target.value)} placeholder="Link dẫn tới phòng hoàn thành *" required className="w-full p-2 text-xs rounded-xl border border-emerald-500 bg-transparent" />
                )}

                <button type="submit" className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow">
                  + Đăng Phòng Mới
                </button>
              </form>

              {/* Room Management List */}
              <div className="lg:col-span-2 space-y-3">
                <h3 className="font-bold text-sm">Danh Sách Phòng Hiện Có ({db.rooms.length})</h3>
                <div className="space-y-2 max-h-[500px] overflow-y-auto">
                  {db.rooms.map(room => (
                    <div key={room.id} className={`p-3 rounded-2xl border ${cardBg} flex justify-between items-center text-xs`}>
                      <div className="flex items-center gap-3">
                        <img src={room.image} className="w-12 h-12 object-cover rounded-xl" />
                        <div>
                          <p className="font-bold">{room.name} {room.pinRank > 0 && `(📌 Top ${room.pinRank})`}</p>
                          <p className="opacity-60 text-[10px]">{room.isCompleted ? "✓ Đã xong" : "Đang thi công"} • {room.votes} vote</p>
                        </div>
                      </div>
                      <button onClick={() => handleDeleteRoom(room.id)} className="text-rose-500 font-bold px-3 py-1 bg-rose-500/10 rounded-lg hover:bg-rose-500/20">
                        Xóa
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          ) : (
            /* MUSIC MANAGEMENT */
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <form onSubmit={handleAddSong} className={`p-6 rounded-3xl border ${cardBg} space-y-3`}>
                <h3 className="font-bold text-sm">Thêm Bài Hát Mới</h3>
                <input value={songTitle} onChange={(e) => setSongTitle(e.target.value)} placeholder="Tên bài hát *" required className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />
                <input value={songArtist} onChange={(e) => setSongArtist(e.target.value)} placeholder="Tên ca sĩ / Nhạc sĩ" className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />
                <input value={songUrl} onChange={(e) => setSongUrl(e.target.value)} placeholder="Link MP3 trực tiếp *" required className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />
                <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl shadow">
                  + Tải Nhạc Lên
                </button>
              </form>

              <div className="lg:col-span-2 space-y-3">
                <h3 className="font-bold text-sm">Playlist Quán Trọ ({db.songs.length})</h3>
                <div className="space-y-2 max-h-[500px] overflow-y-auto">
                  {db.songs.map(song => (
                    <div key={song.id} className={`p-3 rounded-2xl border ${cardBg} flex justify-between items-center text-xs`}>
                      <div>
                        <p className="font-bold">{song.title}</p>
                        <p className="opacity-60 text-[10px]">{song.artist}</p>
                      </div>
                      <button onClick={() => handleDeleteSong(song.id)} className="text-rose-500 font-bold px-3 py-1 bg-rose-500/10 rounded-lg hover:bg-rose-500/20">
                        Gỡ
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render React App to DOM
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
