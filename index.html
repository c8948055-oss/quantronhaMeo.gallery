<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quán Trọ Nhà Mèo - Kỷ Nguyên Mới</title>
  
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes float-note {
      0% { transform: translateY(0px) scale(0.8); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-40px) translateX(15px) scale(1.2); opacity: 0; }
    }
    @keyframes falling-leaf {
      0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translate(100px, 100vh) rotate(360deg); opacity: 0; }
    }
    @keyframes firefly-glow {
      0%, 100% { opacity: 0.2; transform: scale(0.8) translateY(0); }
      50% { opacity: 0.9; transform: scale(1.3) translateY(-15px); }
    }
    @keyframes pop-in {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-spin-slow { animation: spin-slow 8s linear infinite; }
    .animate-float-1 { animation: float-note 2.5s ease-in-out infinite; }
    .animate-float-2 { animation: float-note 3s ease-in-out 1s infinite; }
    .animate-pop-in { animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .leaf-particle { position: fixed; pointer-events: none; z-index: 1; animation: falling-leaf 12s linear infinite; }
    .firefly-particle { position: fixed; pointer-events: none; z-index: 1; border-radius: 50%; animation: firefly-glow 4s ease-in-out infinite; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 4px; }
  </style>
</head>
<body class="transition-colors duration-500 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- MOCK DATABASE KHỞI TẠO ---
    const INITIAL_DATA = {
      rooms: [
        { id: 1, name: "Phòng Trà Mây Ngủ", image: "https://picsum.photos/seed/room1/600/400", tags: ["Thư giãn", "Trà đạo"], note: "Có ban công ngắm suối", idea: "Thiết kế gỗ mộc và rèm lụa bồng bềnh", isCompleted: false, link: "", votes: 42, pinRank: 1, createdAt: Date.now() - 30000 },
        { id: 2, name: "Gác Mái Đom Đóm", image: "https://picsum.photos/seed/room2/600/400", tags: ["Lãng mạn", "Ban đêm"], note: "Kính thiên văn ngắm sao", idea: "Trần nhà kính nhìn thẳng lên bầu trời đêm", isCompleted: false, link: "", votes: 35, pinRank: 2, createdAt: Date.now() - 20000 },
        { id: 5, name: "Căn Nhà Gỗ Cũ (Đã Mở)", image: "https://picsum.photos/seed/room5/600/400", tags: ["Hoàn thành"], note: "Đã đi vào hoạt động", idea: "Căn phòng đầu tiên của quán", isCompleted: true, link: "https://google.com", votes: 89, pinRank: 0, createdAt: Date.now() - 100000 }
      ],
      songs: [
        { id: 1, title: "Khúc Hát Ban Mai", artist: "Mèo Du Ca", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
        { id: 2, title: "Gió Qua Thung Lũng", artist: "Quán Trọ Band", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" }
      ],
      quizzes: [
        { id: 1, question: "Loài hoa nào thường nở rộ báo hiệu mùa xuân về bên hiên nhà gỗ?", options: ["Hoa Cúc Họa Mi", "Hoa Mai Vàng & Đào", "Hoa Hướng Dương", "Hoa Bồ Công Anh"], correctIndex: 1 },
        { id: 2, title: "Mèo con thường thích uống gì nhất vào buổi sáng?", options: ["Sữa ấm", "Nước suối", "Trà xanh", "Cà phê đen"], correctIndex: 0 },
        { id: 3, title: "Âm thanh nào giúp bạn dễ ngủ nhất tại quán trọ?", options: ["Tiếng xe cộ", "Tiếng mưa rơi róc rách", "Tiếng tivi", "Tiếng đồng hồ"], correctIndex: 1 }
      ],
      settings: {
        rewards: { water: 25, star: 20, diary: 15, story: 10, quiz: 20, tea: 20, lostItem: 5, fishCommon: 8, fishRare: 15, fishLegend: 40 },
        gameImages: { garden: "", fishing: "", star: "", diary: "", story: "", quiz: "", tea: "" }
      },
      shopItems: [
        { id: "giuong_nem", name: "Giường Nệm Bông", category: "Nội thất", price: 40, icon: "🛏️" },
        { id: "ke_sach", name: "Kệ Sách Cổ", category: "Nội thất", price: 35, icon: "📚" },
        { id: "ho_nuoc", name: "Hồ Nước Nhỏ", category: "Sân vườn", price: 50, icon: "⛲" }
      ],
      user: {
        name: "Vị Khách Đáng Yêu",
        avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=catguest",
        email: "khach@nhameo.vn",
        loc: 150,
        houseName: "Tổ Ấm Của Mèo",
        hasCustomHouseName: false,
        checkInStreak: 3,
        lastCheckIn: null,
        houseItems: ["giuong_go", "tham_co", "chau_hoa"],
        gardenItems: ["hoa_cuc", "ban_tra"],
        fishCollection: ["Cá Bảy Màu", "Cá Chép Vàng"],
        diaryEntries: [],
        storyChapters: [],
        gardenProgress: 0,
        // Daily trackers
        daily: {
          date: "", water: 0, fish: 0, star: 0, diary: 0, story: 0, tea: 0, quiz: 0, lostItemsFound: 0, maxLostItems: 6
        }
      }
    };

    function App() {
      const [theme, setTheme] = useState(() => localStorage.getItem("theme") || "light");
      const [db, setDb] = useState(() => {
        const saved = localStorage.getItem("quan_tro_db");
        return saved ? JSON.parse(saved) : INITIAL_DATA;
      });
      const [activeTab, setActiveTab] = useState("rooms");
      const [isAdmin, setIsAdmin] = useState(false);
      
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showMusicDrawer, setShowMusicDrawer] = useState(false);
      const [notification, setNotification] = useState("");

      // CHECK AND RESET DAILY LIMITS (00:00 Reset)
      useEffect(() => {
        const todayStr = new Date().toDateString();
        if (db.user.daily?.date !== todayStr) {
          const maxLost = Math.floor(Math.random() * 5) + 6; // Random 6 to 10
          setDb(prev => ({
            ...prev,
            user: {
              ...prev.user,
              daily: {
                date: todayStr, water: 0, fish: 0, star: 0, diary: 0, story: 0, tea: 0, quiz: 0,
                lostItemsFound: 0, maxLostItems: maxLost
              }
            }
          }));
        }
      }, []); // Run once on mount

      // SAVE DB TO LOCALSTORAGE
      useEffect(() => {
        localStorage.setItem("quan_tro_db", JSON.stringify(db));
      }, [db]);

      useEffect(() => {
        localStorage.setItem("theme", theme);
      }, [theme]);

      const notify = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(""), 3500);
      };

      const addLoc = (amount, reason) => {
        setDb(prev => ({
          ...prev,
          user: { ...prev.user, loc: prev.user.loc + amount }
        }));
        notify(`🍀 +${amount} Lộc (${reason})`);
      };

      // AUDIO ENGINE
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentSongIndex, setCurrentSongIndex] = useState(0);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const audioRef = useRef(new Audio());

      useEffect(() => {
        if (db.songs.length > 0) {
          audioRef.current.src = db.songs[0].url;
        }
      }, []);

      useEffect(() => {
        const audio = audioRef.current;
        const updateTime = () => setCurrentTime(audio.currentTime);
        const updateDuration = () => setDuration(audio.duration || 0);
        const handleEnded = () => {
          setCurrentSongIndex(prev => {
            const next = (prev + 1) % db.songs.length;
            audio.src = db.songs[next].url;
            audio.play().catch(() => setIsPlaying(false));
            return next;
          });
        };

        audio.addEventListener("timeupdate", updateTime);
        audio.addEventListener("loadedmetadata", updateDuration);
        audio.addEventListener("ended", handleEnded);

        return () => {
          audio.removeEventListener("timeupdate", updateTime);
          audio.removeEventListener("loadedmetadata", updateDuration);
          audio.removeEventListener("ended", handleEnded);
        };
      }, [db.songs]);

      const togglePlay = () => {
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          if (db.songs.length > 0) {
            audioRef.current.play().then(() => setIsPlaying(true)).catch(() => notify("Vui lòng tương tác với trang trước!"));
          } else {
            notify("Chưa có bài hát nào trong Playlist!");
          }
        }
      };

      const playSong = (index) => {
        setCurrentSongIndex(index);
        audioRef.current.src = db.songs[index].url;
        audioRef.current.play().then(() => setIsPlaying(true));
      };

      // CHECK-IN
      const handleCheckIn = () => {
        const today = new Date().toDateString();
        if (db.user.lastCheckIn === today) {
          notify("Hôm nay bạn đã ghé thăm Nhà Trọ rồi, mai quay lại nhé!");
          return;
        }
        const newStreak = (db.user.checkInStreak || 0) + 1;
        let reward = 10;
        if (newStreak % 30 === 0) reward = 100;
        else if (newStreak % 14 === 0) reward = 50;
        else if (newStreak % 7 === 0) reward = 30;
        else if (newStreak % 3 === 0) reward = 20;

        setDb(prev => ({
          ...prev,
          user: { ...prev.user, loc: prev.user.loc + reward, checkInStreak: newStreak, lastCheckIn: today }
        }));
        notify(`🎉 Ghé trọ ngày ${newStreak}! Nhận +${reward} 🍀 Lộc`);
      };

      // LOST ITEM MECHANIC (5-8s lifespan, 6-10 times/day)
      const [lostItem, setLostItem] = useState(null);
      useEffect(() => {
        if (!db.user.daily || db.user.daily.lostItemsFound >= db.user.daily.maxLostItems) return;
        
        const spawnTimer = setInterval(() => {
          if (Math.random() > 0.6 && !lostItem) {
            const items = ["🍃", "🗝️", "🌸", "🐈", "⭐", "🎵", "🦋", "🍄"];
            const newId = Date.now();
            setLostItem({
              id: newId,
              icon: items[Math.floor(Math.random() * items.length)],
              top: Math.floor(Math.random() * 70 + 15) + "%",
              left: Math.floor(Math.random() * 70 + 15) + "%"
            });
            
            // Auto remove after 5-8 seconds
            const duration = Math.floor(Math.random() * 3000) + 5000;
            setTimeout(() => {
              setLostItem(prev => (prev && prev.id === newId ? null : prev));
            }, duration);
          }
        }, 12000); // Check every 12 seconds
        
        return () => clearInterval(spawnTimer);
      }, [db.user.daily, lostItem]);

      const collectLostItem = () => {
        const reward = db.settings.rewards.lostItem || 5;
        addLoc(reward, "Tìm thấy vật thất lạc!");
        setLostItem(null);
        setDb(prev => ({
          ...prev,
          user: { ...prev.user, daily: { ...prev.user.daily, lostItemsFound: prev.user.daily.lostItemsFound + 1 } }
        }));
      };

      const isDark = theme === "dark";
      const bgClasses = isDark ? "bg-slate-950 text-indigo-100" : "bg-emerald-50 text-slate-800";
      const cardBg = isDark ? "bg-slate-900/80 border-slate-800 backdrop-blur-md" : "bg-white/90 border-emerald-100/80 backdrop-blur-md shadow-sm";

      return (
        <div className={`min-h-screen relative overflow-x-hidden ${bgClasses}`}>
          {/* Atmospheric Background */}
          {!isDark ? (
            <>
              <div className="leaf-particle" style={{ left: "10%", animationDelay: "0s" }}>🍃</div>
              <div className="leaf-particle" style={{ left: "45%", animationDelay: "5s" }}>🌸</div>
              <div className="leaf-particle" style={{ left: "80%", animationDelay: "2s" }}>🍃</div>
            </>
          ) : (
            <>
              <div className="firefly-particle bg-yellow-300 w-2 h-2" style={{ top: "30%", left: "20%", boxShadow: "0 0 10px #fef08a" }}></div>
              <div className="firefly-particle bg-yellow-300 w-1.5 h-1.5" style={{ top: "70%", left: "60%", animationDelay: "2s", boxShadow: "0 0 8px #fef08a" }}></div>
            </>
          )}

          {/* Lost Item Button */}
          {lostItem && (
            <button
              key={lostItem.id}
              onClick={collectLostItem}
              style={{ top: lostItem.top, left: lostItem.left }}
              className="fixed z-40 text-3xl p-2 bg-white/40 dark:bg-slate-800/60 rounded-full shadow-lg hover:scale-125 transition-transform animate-pop-in"
              title="Nhặt vật phẩm bí mật!"
            >
              {lostItem.icon}
            </button>
          )}

          {/* Notifications */}
          {notification && (
            <div className="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 px-5 py-2.5 bg-emerald-600 dark:bg-indigo-600 text-white rounded-full shadow-xl text-sm font-medium animate-pulse">
              {notification}
            </div>
          )}

          {/* HEADER */}
          <header className={`border-b sticky top-0 z-30 ${isDark ? "border-slate-800 bg-slate-950/90" : "border-emerald-100 bg-white/90"} backdrop-blur-md`}>
            <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab("rooms")}>
                <div className="w-11 h-11 rounded-full overflow-hidden bg-emerald-100 flex items-center justify-center shadow-inner border-2 border-emerald-400">
                  <span className="text-2xl">🐱</span>
                </div>
                <div>
                  <h1 className="font-bold text-lg tracking-wide text-emerald-800 dark:text-indigo-200">Quán trọ nhà Mèo</h1>
                  <p className="text-xs text-emerald-600/80 dark:text-indigo-400/80">Nơi dừng chân thảnh thơi</p>
                </div>
              </div>

              {/* Desktop Nav */}
              <nav className="hidden md:flex items-center gap-1">
                {[
                  { id: "rooms", label: "Phòng Sắp Ra Mắt", icon: "🚪" },
                  { id: "games", label: "Góc Thư Giãn (Games)", icon: "🎮" },
                  { id: "shop", label: "Cửa Hàng", icon: "🛍️" },
                  ...(isAdmin ? [{ id: "admin", label: "Trang Quản Trị", icon: "⚙️" }] : [])
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3.5 py-1.5 rounded-full text-xs font-semibold transition-all flex items-center gap-1.5 ${
                      activeTab === tab.id
                        ? (isDark ? "bg-indigo-600 text-white shadow-md" : "bg-emerald-600 text-white shadow-md")
                        : "hover:bg-black/5 dark:hover:bg-white/5 opacity-80"
                    }`}
                  >
                    <span>{tab.icon}</span> <span>{tab.label}</span>
                  </button>
                ))}
              </nav>

              {/* Right Controls */}
              <div className="flex items-center gap-2.5">
                <div className={`flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold border ${isDark ? "bg-slate-900 border-indigo-900/60 text-yellow-300" : "bg-emerald-100/70 border-emerald-200 text-emerald-800"}`}>
                  <span>🍀</span> <span>{db.user.loc}</span>
                </div>
                <button onClick={() => setTheme(isDark ? "light" : "dark")} className="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 text-sm">
                  {isDark ? "🌙" : "☀️"}
                </button>
                <button onClick={handleCheckIn} className={`hidden sm:flex items-center gap-1 px-3 py-1 rounded-full text-xs font-semibold shadow transition-transform active:scale-95 ${isDark ? "bg-amber-600 text-white" : "bg-amber-500 text-white"}`}>
                  🍀 Ghé Trọ
                </button>
                {!isAdmin ? (
                  <button onClick={() => setShowLoginModal(true)} className="text-xs px-2.5 py-1 rounded-lg border border-slate-300 dark:border-slate-700 hover:border-emerald-500 font-medium">
                    Admin
                  </button>
                ) : (
                  <button onClick={() => { setIsAdmin(false); setActiveTab("rooms"); notify("Đã thoát Admin"); }} className="text-xs px-2.5 py-1 rounded-lg bg-rose-500/20 text-rose-400 font-medium border border-rose-500/30">
                    Đăng xuất
                  </button>
                )}
              </div>
            </div>

            {/* Mobile Nav */}
            <div className="flex md:hidden overflow-x-auto px-4 py-2 gap-2 border-t border-black/5 dark:border-white/5 text-xs">
              <button onClick={() => setActiveTab("rooms")} className={`px-2.5 py-1 rounded-full whitespace-nowrap ${activeTab === 'rooms' ? 'font-bold underline' : ''}`}>🚪 Phòng</button>
              <button onClick={() => setActiveTab("games")} className={`px-2.5 py-1 rounded-full whitespace-nowrap ${activeTab === 'games' ? 'font-bold underline' : ''}`}>🎮 Games</button>
              <button onClick={() => setActiveTab("shop")} className={`px-2.5 py-1 rounded-full whitespace-nowrap ${activeTab === 'shop' ? 'font-bold underline' : ''}`}>🛍️ Cửa Hàng</button>
              {isAdmin && <button onClick={() => setActiveTab("admin")} className={`px-2.5 py-1 rounded-full whitespace-nowrap text-rose-500 font-bold`}>⚙️ Quản Trị</button>}
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-8 relative z-10 pb-28">
            {activeTab === "rooms" && <RoomsView db={db} setDb={setDb} notify={notify} cardBg={cardBg} isDark={isDark} />}
            {activeTab === "games" && <MiniGamesView db={db} setDb={setDb} notify={notify} cardBg={cardBg} isDark={isDark} addLoc={addLoc} />}
            {activeTab === "shop" && <ShopView db={db} setDb={setDb} notify={notify} cardBg={cardBg} isDark={isDark} />}
            {activeTab === "admin" && isAdmin && <AdminView db={db} setDb={setDb} notify={notify} cardBg={cardBg} isDark={isDark} />}
          </main>

          {/* MUSIC PLAYER WIDGET */}
          <div className="fixed bottom-6 right-6 z-40 flex flex-col items-end">
            {isPlaying && (
              <div className="relative w-12 h-6 pointer-events-none mb-1 text-emerald-500 font-bold">
                <span className="absolute left-2 animate-float-1">🎵</span>
                <span className="absolute right-2 animate-float-2">🎶</span>
              </div>
            )}
            <div className="flex items-center gap-2">
              <button onClick={() => setShowMusicDrawer(!showMusicDrawer)} className={`p-2.5 rounded-full shadow-lg ${isDark ? "bg-slate-800 text-indigo-200" : "bg-white text-emerald-800"}`}>📜</button>
              <div onClick={togglePlay} className={`w-14 h-14 rounded-full border-4 cursor-pointer shadow-xl flex items-center justify-center relative transition-transform hover:scale-105 ${isDark ? "border-slate-800 bg-slate-900" : "border-emerald-100 bg-slate-900"} ${isPlaying ? "animate-spin-slow" : ""}`}>
                <div className="w-10 h-10 rounded-full border border-slate-700 flex items-center justify-center">
                  <div className="w-5 h-5 rounded-full bg-amber-600 flex items-center justify-center text-[9px] text-white font-bold">{isPlaying ? "⏸" : "▶"}</div>
                </div>
              </div>
            </div>

            {showMusicDrawer && (
              <div className={`mt-3 w-80 p-4 rounded-2xl shadow-2xl border ${cardBg}`}>
                <div className="flex justify-between items-center mb-3">
                  <h4 className="font-bold text-sm">📻 Giai Điệu Quán Trọ</h4>
                  <button onClick={() => setShowMusicDrawer(false)} className="text-xs">✕</button>
                </div>
                <div className="mb-3 p-2.5 rounded-xl bg-black/5 dark:bg-white/5 text-xs">
                  <p className="font-semibold truncate">{db.songs[currentSongIndex]?.title || "Chưa có nhạc"}</p>
                  <p className="opacity-70 text-[11px] truncate">{db.songs[currentSongIndex]?.artist}</p>
                </div>
                <div className="max-h-40 overflow-y-auto space-y-1 text-xs">
                  {db.songs.map((s, idx) => (
                    <div key={s.id} onClick={() => playSong(idx)} className={`p-2 rounded-lg cursor-pointer flex justify-between transition-colors ${currentSongIndex === idx ? (isDark ? "bg-indigo-600/30 text-indigo-300 font-bold" : "bg-emerald-600/20 text-emerald-900 font-bold") : "hover:bg-black/5"}`}>
                      <p className="truncate">{s.title}</p>
                      <span>{currentSongIndex === idx && isPlaying ? "🎵" : "▶"}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* SECURE ADMIN LOGIN MODAL */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`max-w-sm w-full p-8 rounded-3xl shadow-2xl border ${cardBg}`}>
                <div className="text-center mb-6">
                  <span className="text-4xl">🔐</span>
                  <h3 className="font-black text-lg mt-2">Xác Thực Quản Trị Viên</h3>
                  <p className="text-xs opacity-70 mt-1">Khu vực dành riêng cho người điều hành</p>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (e.target.password.value === "bhnt2006") {
                    setIsAdmin(true); setShowLoginModal(false); setActiveTab("admin"); notify("Đăng nhập Admin thành công!");
                  } else {
                    notify("Mật khẩu không chính xác!");
                  }
                }}>
                  <input
                    name="password"
                    type="password"
                    placeholder="Nhập mật khẩu..."
                    className="w-full px-4 py-3 text-sm rounded-xl border border-slate-300 dark:border-slate-700 bg-black/5 dark:bg-white/5 mb-5 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono tracking-widest text-center"
                    autoFocus
                  />
                  <div className="flex gap-3 text-sm font-bold">
                    <button type="button" onClick={() => setShowLoginModal(false)} className="flex-1 py-3 rounded-xl hover:bg-black/5 dark:hover:bg-white/5">Thoát</button>

    // ==========================================
    // ROOMS VIEW
    // ==========================================
    function RoomsView({ db, setDb, notify, cardBg, isDark }) {
      const handleVote = (roomId) => {
        setDb(prev => ({
          ...prev,
          rooms: prev.rooms.map(r => r.id === roomId ? { ...r, votes: r.votes + 1 } : r)
        }));
        notify("Đã Chấm hóng thành công! 💖");
      };

      const pinnedRooms = useMemo(() => {
        return db.rooms.filter(r => r.pinRank > 0 && !r.isCompleted).sort((a, b) => a.pinRank - b.pinRank);
      }, [db.rooms]);

      const otherRooms = useMemo(() => {
        const uncompleted = db.rooms.filter(r => r.pinRank === 0 && !r.isCompleted).sort((a, b) => b.createdAt - a.createdAt);
        const completed = db.rooms.filter(r => r.isCompleted).sort((a, b) => b.votes - a.votes);
        return [...uncompleted, ...completed]; // Completed ALWAYS pushed to bottom
      }, [db.rooms]);

      return (
        <div className="space-y-10">
          <div className={`p-8 rounded-3xl border ${cardBg} text-center space-y-3`}>
            <span className="text-3xl">🌸 🍃 🏡</span>
            <h2 className="text-2xl font-extrabold">Các Căn Phòng Quán Trọ</h2>
          </div>

          {pinnedRooms.length > 0 && (
            <div className="space-y-4">
              <h3 className="font-bold text-lg">📌 Bảng Ghim Đặc Biệt</h3>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {pinnedRooms.map(room => <RoomCard key={room.id} room={room} onVote={() => handleVote(room.id)} isPinned rank={room.pinRank} cardBg={cardBg} isDark={isDark} />)}
              </div>
            </div>
          )}

          <div className="space-y-4 pt-4 border-t border-black/5 dark:border-white/5">
            <h3 className="font-bold text-lg">🚪 Tất Cả Phòng Nghỉ</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {otherRooms.map(room => <RoomCard key={room.id} room={room} onVote={() => handleVote(room.id)} cardBg={cardBg} isDark={isDark} />)}
            </div>
          </div>
        </div>
      );
    }

            <div className="absolute bottom-2.5 left-3 flex flex-wrap gap-1">
              {room.tags.map((t, idx) => <span key={idx} className="px-2 py-0.5 bg-white/80 dark:bg-slate-900/80 text-[10px] font-bold rounded-md">#{t}</span>)}

    // GAME 2
    function FishingGame({ db, setDb, addLoc, notify }) {
      const [status, setStatus] = useState("idle");
      const castRod = () => {
        if (db.user.daily.fish >= 1) return notify("Hôm nay câu đủ rồi, nhường cá cho suối nghỉ ngơi nhé! 🎣");
        setStatus("waiting");
        setTimeout(() => setStatus("bite"), Math.random() * 2000 + 1500);
      };
      const pullRod = () => {
        if (status === "bite") {
          const rand = Math.random();
          let fish, rw;
          if (rand > 0.9) { fish = "Cá Thần Băng"; rw = db.settings.rewards.fishLegend; }
          else if (rand > 0.5) { fish = "Cá Chép Vàng"; rw = db.settings.rewards.fishRare; }
          else { fish = "Cá Bảy Màu"; rw = db.settings.rewards.fishCommon; }
          
          addLoc(rw, `Câu được ${fish}`);
          setDb(prev => ({ ...prev, user: { ...prev.user, daily: { ...prev.user.daily, fish: 1 } } }));
          setStatus("idle");
        } else {
          notify("Giật sớm quá cá chạy mất rồi!");
          setStatus("idle");
        }
      };
      return (
        <div className="text-center max-w-md mx-auto py-4">
          <h3 className="font-bold text-lg mb-4">🎣 Câu Cá Bên Suối</h3>
          <GameVisual imgUrl={db.settings.gameImages.fishing} emoji={status === "idle" ? "🌊" : (status==="waiting" ? "🎣..." : "❗🐟❗")} />
          {status === "idle" && <button onClick={castRod} className="px-6 py-2.5 bg-sky-600 text-white font-bold rounded-2xl">Thả Cần Câu 🎣</button>}
          {status === "waiting" && <button onClick={() => setStatus("idle")} className="px-6 py-2.5 bg-slate-500 text-white font-bold rounded-2xl">Thu Cần Lại</button>}
          {status === "bite" && <button onClick={pullRod} className="px-8 py-3 bg-rose-600 text-white font-extrabold rounded-2xl animate-pulse">GIẬT CẦN NGAY!</button>}
        </div>

        if (db.user.daily.quiz >= 1) return notify("Bạn đã trả lời câu hỏi hôm nay rồi! 🧩");

        if (idx === quiz.correctIndex) {
          addLoc(db.settings.rewards.quiz, "Trả lời đúng câu hỏi!");

    // ==========================================
    // ADMIN VIEW (FULL CRUD, NO PLACEHOLDERS)
    // ==========================================
    function AdminView({ db, setDb, notify, cardBg }) {
      const [tab, setTab] = useState("rooms"); // rooms | music | quiz | config
      
      // FORM STATES - ROOMS
      const [editingRoomId, setEditingRoomId] = useState(null);
      const [rName, setRName] = useState(""); const [rImg, setRImg] = useState(""); const [rTags, setRTags] = useState("");
      const [rNote, setRNote] = useState(""); const [rIdea, setRIdea] = useState(""); const [rLink, setRLink] = useState("");
      const [rPin, setRPin] = useState(0); const [rDone, setRDone] = useState(false);

      const loadRoom = (r) => {
        setEditingRoomId(r.id); setRName(r.name); setRImg(r.image); setRTags(r.tags.join(", "));
        setRNote(r.note); setRIdea(r.idea); setRLink(r.link || ""); setRPin(r.pinRank); setRDone(r.isCompleted);
      };
      
      const saveRoom = (e) => {
        e.preventDefault();
        const payload = {
          id: editingRoomId || Date.now(),
          name: rName, image: rImg, tags: rTags.split(",").map(t=>t.trim()), note: rNote, idea: rIdea,
          link: rLink, pinRank: Number(rPin), isCompleted: rDone,
          votes: editingRoomId ? db.rooms.find(x=>x.id===editingRoomId).votes : 0,
          createdAt: editingRoomId ? db.rooms.find(x=>x.id===editingRoomId).createdAt : Date.now()
        };
        if(rDone && !rLink.trim()) return notify("Phòng đã hoàn thành bắt buộc phải có Link!");
        
        setDb(prev => ({
          ...prev,
          rooms: editingRoomId ? prev.rooms.map(x => x.id === editingRoomId ? payload : x) : [...prev.rooms, payload]
        }));
        notify(editingRoomId ? "Cập nhật phòng thành công!" : "Thêm phòng thành công!");
        setEditingRoomId(null); setRName(""); setRImg(""); setRTags(""); setRNote(""); setRIdea(""); setRLink(""); setRPin(0); setRDone(false);
      };

      // FORM STATES - MUSIC
      const [editingSongId, setEditingSongId] = useState(null);
      const [sTitle, setSTitle] = useState(""); const [sArtist, setSArtist] = useState(""); const [sUrl, setSUrl] = useState("");
      const loadSong = (s) => { setEditingSongId(s.id); setSTitle(s.title); setSArtist(s.artist); setSUrl(s.url); };
      const saveSong = (e) => {
        e.preventDefault();
        const payload = { id: editingSongId || Date.now(), title: sTitle, artist: sArtist, url: sUrl };
        setDb(prev => ({
          ...prev, songs: editingSongId ? prev.songs.map(x=>x.id===editingSongId ? payload:x) : [...prev.songs, payload]
        }));
        notify("Lưu nhạc thành công!"); setEditingSongId(null); setSTitle(""); setSArtist(""); setSUrl("");
      };

      // FORM STATES - QUIZZES
      const [editingQuizId, setEditingQuizId] = useState(null);
      const [qText, setQText] = useState(""); const [qOpts, setQOpts] = useState(""); const [qAns, setQAns] = useState(0);
      const loadQuiz = (q) => { setEditingQuizId(q.id); setQText(q.question || q.title); setQOpts(q.options.join(" | ")); setQAns(q.correctIndex); };
      const saveQuiz = (e) => {
        e.preventDefault();
        const payload = { id: editingQuizId || Date.now(), question: qText, options: qOpts.split("|").map(t=>t.trim()), correctIndex: Number(qAns) };
        setDb(prev => ({
          ...prev, quizzes: editingQuizId ? prev.quizzes.map(x=>x.id===editingQuizId ? payload:x) : [...prev.quizzes, payload]
        }));
        notify("Lưu câu hỏi thành công!"); setEditingQuizId(null); setQText(""); setQOpts(""); setQAns(0);
      };

      // SETTINGS (Shop Prices, Rewards, Images)
      const saveSettings = (e) => {
        e.preventDefault();
        // Uses refs or just straight form submit via elements, to avoid 50 state variables.
        const fd = new FormData(e.target);
        
        // Build updated shop
        const updatedShop = db.shopItems.map(item => ({ ...item, price: Number(fd.get(`shop_${item.id}`)) }));
        
        // Build updated rewards
        const rw = { ...db.settings.rewards };
        ["water", "star", "diary", "story", "quiz", "tea", "lostItem"].forEach(k => rw[k] = Number(fd.get(`rw_${k}`)));
        
        // Build updated images
        const imgs = { ...db.settings.gameImages };
        ["garden", "fishing", "star", "diary", "story", "quiz", "tea"].forEach(k => imgs[k] = fd.get(`img_${k}`));

        setDb(prev => ({
          ...prev,
          shopItems: updatedShop,
          settings: { ...prev.settings, rewards: rw, gameImages: imgs }
        }));
        notify("Lưu toàn bộ Cấu hình Hệ thống thành công!");
      };

      return (
        <div className="space-y-6">
          {/* Admin Header Tabs */}
          <div className={`p-4 rounded-3xl border ${cardBg} flex gap-2 overflow-x-auto`}>
            <button onClick={()=>setTab('rooms')} className={`px-4 py-2 font-bold rounded-xl text-xs whitespace-nowrap ${tab==='rooms' ? 'bg-emerald-600 text-white' : 'bg-black/5'}`}>Phòng (Rooms)</button>
            <button onClick={()=>setTab('music')} className={`px-4 py-2 font-bold rounded-xl text-xs whitespace-nowrap ${tab==='music' ? 'bg-emerald-600 text-white' : 'bg-black/5'}`}>Nhạc (Music)</button>
            <button onClick={()=>setTab('quiz')} className={`px-4 py-2 font-bold rounded-xl text-xs whitespace-nowrap ${tab==='quiz' ? 'bg-emerald-600 text-white' : 'bg-black/5'}`}>Câu đố (Quiz)</button>
            <button onClick={()=>setTab('config')} className={`px-4 py-2 font-bold rounded-xl text-xs whitespace-nowrap ${tab==='config' ? 'bg-emerald-600 text-white' : 'bg-black/5'}`}>Cấu hình (Thưởng/Ảnh/Giá)</button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            {/* 1. ROOMS TAB */}
            {tab === "rooms" && (
              <>
                <form onSubmit={saveRoom} className={`p-6 rounded-3xl border ${cardBg} space-y-3`}>
                  <h3 className="font-bold text-sm text-emerald-600">{editingRoomId ? "Sửa Phòng" : "Thêm Phòng Mới"}</h3>
                  <input value={rName} onChange={e=>setRName(e.target.value)} placeholder="Tên phòng *" required className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />
                  <input value={rImg} onChange={e=>setRImg(e.target.value)} placeholder="Link ảnh (URL)" className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />
                  <input value={rTags} onChange={e=>setRTags(e.target.value)} placeholder="Tags (Cúc, Hoa, Gỗ...)" className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />
                  <textarea value={rNote} onChange={e=>setRNote(e.target.value)} placeholder="Ghi chú" className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent h-12" />
                  <textarea value={rIdea} onChange={e=>setRIdea(e.target.value)} placeholder="Ý tưởng thiết kế" className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent h-12" />
                  
                  <div className="flex gap-2">
                    <select value={rPin} onChange={e=>setRPin(e.target.value)} className="flex-1 p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent">
                      <option value={0}>Không ghim</option><option value={1}>Top 1</option><option value={2}>Top 2</option><option value={3}>Top 3</option>
                    </select>
                    <label className="flex-1 flex items-center gap-1 text-xs font-bold text-emerald-600 cursor-pointer">
                      <input type="checkbox" checked={rDone} onChange={e=>setRDone(e.target.checked)} /> Đã hoàn thành
                    </label>
                  </div>
                  {rDone && <input value={rLink} onChange={e=>setRLink(e.target.value)} placeholder="Nhập Link dẫn tới phòng (Bắt buộc) *" required className="w-full p-2 text-xs rounded-xl border border-emerald-500 bg-transparent" />}
                  <div className="flex gap-2">
                    {editingRoomId && <button type="button" onClick={()=>{setEditingRoomId(null); setRName("");}} className="flex-1 py-2 bg-slate-500 text-white rounded-xl text-xs font-bold">Hủy Sửa</button>}
                    <button type="submit" className="flex-1 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">{editingRoomId ? "Lưu Phòng" : "+ Thêm"}</button>
                  </div>
                </form>
                <div className="lg:col-span-2 space-y-2 max-h-[500px] overflow-y-auto">
                  {db.rooms.map(r => (
                    <div key={r.id} className={`p-3 rounded-xl border ${cardBg} flex justify-between items-center`}>
                      <div>
                        <p className="font-bold text-sm">{r.name} {r.pinRank > 0 && `(Top ${r.pinRank})`}</p>
                        <p className="text-[10px] opacity-70">{r.isCompleted ? `✓ Có link: ${r.link}` : "Đang thi công"}</p>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={()=>loadRoom(r)} className="text-xs px-3 py-1 bg-sky-500/10 text-sky-600 font-bold rounded-lg">Sửa</button>
                        <button onClick={()=>setDb(p=>({...p, rooms: p.rooms.filter(x=>x.id!==r.id)}))} className="text-xs px-3 py-1 bg-rose-500/10 text-rose-600 font-bold rounded-lg">Xóa</button>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}

            {/* 2. MUSIC TAB */}
            {tab === "music" && (
              <>
                <form onSubmit={saveSong} className={`p-6 rounded-3xl border ${cardBg} space-y-3`}>
                  <h3 className="font-bold text-sm text-indigo-600">{editingSongId ? "Sửa Bài Hát" : "Thêm Bài Hát"}</h3>
                  <input value={sTitle} onChange={e=>setSTitle(e.target.value)} placeholder="Tên bài hát *" required className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />
                  <input value={sArtist} onChange={e=>setSArtist(e.target.value)} placeholder="Ca sĩ" className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />
                  <input value={sUrl} onChange={e=>setSUrl(e.target.value)} placeholder="Link MP3 trực tiếp *" required className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />
                  <button type="submit" className="w-full py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">{editingSongId ? "Lưu" : "+ Thêm Nhạc"}</button>
                </form>
                <div className="lg:col-span-2 space-y-2 max-h-[500px] overflow-y-auto">
                  {db.songs.map(s => (
                    <div key={s.id} className={`p-3 rounded-xl border ${cardBg} flex justify-between items-center`}>
                      <div><p className="font-bold text-sm">{s.title}</p><p className="text-[10px] opacity-70">{s.artist}</p></div>
                      <div className="flex gap-2">
                        <button onClick={()=>loadSong(s)} className="text-xs px-3 py-1 bg-sky-500/10 text-sky-600 font-bold rounded-lg">Sửa</button>
                        <button onClick={()=>setDb(p=>({...p, songs: p.songs.filter(x=>x.id!==s.id)}))} className="text-xs px-3 py-1 bg-rose-500/10 text-rose-600 font-bold rounded-lg">Xóa</button>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}

            {/* 3. QUIZ TAB */}
            {tab === "quiz" && (
              <>
                <form onSubmit={saveQuiz} className={`p-6 rounded-3xl border ${cardBg} space-y-3`}>
                  <h3 className="font-bold text-sm text-amber-600">{editingQuizId ? "Sửa Câu Hỏi" : "Thêm Câu Hỏi"}</h3>
                  <textarea value={qText} onChange={e=>setQText(e.target.value)} placeholder="Nội dung câu hỏi *" required className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent h-16" />
                  <input value={qOpts} onChange={e=>setQOpts(e.target.value)} placeholder="Đáp án cách nhau bởi dấu | (A | B | C | D)" required className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" />
                  <input type="number" value={qAns} onChange={e=>setQAns(e.target.value)} placeholder="Vị trí đáp án đúng (0, 1, 2, 3)" required className="w-full p-2 text-xs rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent" min="0" max="5" />
                  <button type="submit" className="w-full py-2 bg-amber-600 text-white rounded-xl text-xs font-bold">{editingQuizId ? "Lưu" : "+ Thêm Câu Đố"}</button>
                </form>
                <div className="lg:col-span-2 space-y-2 max-h-[500px] overflow-y-auto">
                  {db.quizzes.map(q => (
                    <div key={q.id} className={`p-3 rounded-xl border ${cardBg} flex justify-between items-start`}>
                      <div>
                        <p className="font-bold text-sm">{q.question || q.title}</p>
                        <p className="text-[10px] opacity-70">Đúng: {q.options[q.correctIndex]}</p>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={()=>loadQuiz(q)} className="text-xs px-3 py-1 bg-sky-500/10 text-sky-600 font-bold rounded-lg">Sửa</button>
                        <button onClick={()=>setDb(p=>({...p, quizzes: p.quizzes.filter(x=>x.id!==q.id)}))} className="text-xs px-3 py-1 bg-rose-500/10 text-rose-600 font-bold rounded-lg">Xóa</button>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}

            {/* 4. CONFIG SETTINGS (Shop Prices, Rewards, Game Images) */}
            {tab === "config" && (
              <form onSubmit={saveSettings} className={`lg:col-span-3 p-6 rounded-3xl border ${cardBg} space-y-6 max-h-[70vh] overflow-y-auto`}>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                  {/* Cột 1: Giá Cửa Hàng */}
                  <div className="space-y-3">
                    <h3 className="font-bold text-sm border-b pb-2">🪙 Cấu hình giá Cửa Hàng</h3>
                    {db.shopItems.map(item => (
                      <div key={item.id} className="flex justify-between items-center text-xs">
                        <span>{item.icon} {item.name}</span>
                        <input name={`shop_${item.id}`} type="number" defaultValue={item.price} className="w-16 p-1 border rounded bg-transparent text-center" />
                      </div>
                    ))}
                  </div>

                  {/* Cột 2: Phần Thưởng Lộc */}
                  <div className="space-y-3">
                    <h3 className="font-bold text-sm border-b pb-2">🍀 Phần Thưởng Mini-Game</h3>
                    {Object.entries({water: "🌱 Tưới nước", star: "🌙 Tạo chòm sao", diary: "📖 Viết nhật ký", story: "📜 Nối truyện", quiz: "🧩 Câu đố", tea: "🍵 Pha trà", lostItem: "🍄 Đồ thất lạc"}).map(([k, label]) => (
                      <div key={k} className="flex justify-between items-center text-xs">
                        <span>{label}</span>
                        <input name={`rw_${k}`} type="number" defaultValue={db.settings.rewards[k]} className="w-16 p-1 border rounded bg-transparent text-center" />
                      </div>
                    ))}
                  </div>

                  {/* Cột 3: Ảnh Trò Chơi */}
                  <div className="space-y-3">
                    <h3 className="font-bold text-sm border-b pb-2">🖼️ Link Ảnh Mini-Game (Bỏ trống dùng Emoji)</h3>
                    {["garden", "fishing", "star", "diary", "story", "quiz", "tea"].map(k => (
                      <div key={k} className="flex flex-col text-xs gap-1">
                        <span className="capitalize">{k}</span>
                        <input name={`img_${k}`} type="url" defaultValue={db.settings.gameImages[k]} placeholder="https://..." className="w-full p-1.5 border rounded bg-transparent" />
                      </div>
                    ))}
                  </div>
                </div>
                <button type="submit" className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-lg">LƯU TẤT CẢ CẤU HÌNH</button>
              </form>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
